function settingsModal(){modal('Your profile & progress',`<p class="subtext">One local profile. No account, password, or cloud sync is implied.</p><div class="field"><label for="profile-name">Your name</label><input id="profile-name" maxlength="60" value="${esc(S.profile.name)}"></div><div class="row"><div class="field grow"><label for="profile-rating">Actual rating (self-reported)</label><input type="number" id="profile-rating" min="100" max="3500" value="${S.profile.rating}"></div><div class="field grow"><label for="profile-goal">Playing goal</label><input type="number" id="profile-goal" min="500" max="3500" value="${S.profile.goal}"></div></div><div class="field"><label for="profile-platform">Platform and time control</label><input id="profile-platform" maxlength="80" value="${esc(S.profile.platform)}" placeholder="Chess.com rapid"></div><div class="field"><label for="profile-minutes">Typical study session (minutes)</label><input type="number" id="profile-minutes" min="10" max="120" value="${S.profile.minutes}"></div><div class="row"><label><input style="width:auto" id="show-dots" type="checkbox" ${S.settings.legalDots?'checked':''}> Show legal-move dots</label><label><input style="width:auto" id="show-coords" type="checkbox" ${S.settings.coords?'checked':''}> Show coordinates</label></div><div class="actions">${btn('Save profile','saveProfile')}${btn('Export backup','export','','secondary')}${btn('Import backup','importBackup','','secondary')}</div><hr class="divider"><div class="notice warning">Browser storage can be cleared or blocked. A new device or hosted URL starts with separate storage. Export/import is the way to move your record. There is no cloud account in this build.</div>${btn('Reset local progress','resetProgress','','danger small')}`);}
function aboutModal(){modal('About Knight Read',`<div class="pill-row"><span class="pill green">Version 1.0</span><span class="pill">English · offline-first</span></div><p>Built for a learner who has done plenty of puzzles but wants the reasoning and structure behind good chess decisions.</p><h3>What is included</h3><p class="subtext">64 original lessons, 128 knowledge checks, 8 chapter checkpoints, a 12-question starting-point check, 130 built-in board drills, 12 opening rehearsal lines, 6 endgame starting positions, board vision, a local practice engine, PGN replay and provisional engine comparison, local progress and JSON backup.</p><h3>What the goal means</h3><p class="subtext">2000 is your target, not a guaranteed result. These lesson bands are approximate organization. The course is a foundation and training framework, not every possible chess position or a substitute for sustained practical play, deeper study, and feedback.</p><h3>Sources and attribution</h3><p class="subtext">Lessons, app code and teaching positions are original. Four real-game puzzles come from the official <a href="https://database.lichess.org/" target="_blank" rel="noopener">Lichess open database</a>, released under CC0. Each links to its game. Imported puzzles keep their source identity. Color/geometry variants are labeled rather than presented as unrelated master games.</p><p class="subtext">The original local engine is not Stockfish. The optional internet download is the GPLv3 <a href="https://github.com/lichess-org/stockfish.js" target="_blank" rel="noopener">Stockfish JavaScript port</a>, package stockfish.js@10.0.2. It is a legacy build, not the current Stockfish. Optional download availability is not guaranteed.</p><h3>Using it on a phone</h3><p class="subtext">The interface is responsive. iOS file previews may not execute an HTML app; use a hosted copy in Safari for dependable phone access. On a computer, open the standalone HTML in a full browser. The source package can be served as a static site. No hosting or cloud synchronization is included in this file.</p><h3>Rules and boundaries</h3><p class="subtext">Standard chess only. The rules engine handles castling, en passant, promotion, checkmate, stalemate, common insufficient-material cases, repetition and move-count draws. It is not a tournament arbiter for every exotic dead position. Engine assistance belongs in study and completed-game review, never a live rated game.</p>`);}
function journalModal(){modal('Reflect on a real game',`<p class="subtext">Record your actual result. Choose one thinking habit to improve in your next game.</p><div class="row"><div class="field grow"><label for="journal-date">Date</label><input id="journal-date" type="date" value="${today()}"></div><div class="field grow"><label for="journal-result">Result</label><select id="journal-result"><option>Win</option><option>Loss</option><option>Draw</option><option>Practice / unrated</option></select></div></div><div class="field"><label for="journal-rating">Rating after this game (optional)</label><input id="journal-rating" type="number" min="100" max="3500" placeholder="Your real ${esc(S.profile.platform)} rating"></div><div class="field"><label for="journal-tag">Main thinking habit</label><select id="journal-tag">${['Opponent threats','Loose pieces','Calculation','Opening purpose','Pawn structure','Endgame technique','Time management','Tilt / process','Good decision worth repeating'].map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="field"><label for="journal-note">One concrete next action</label><textarea id="journal-note" maxlength="2000" placeholder="Before every move, I will name the opponent’s forcing reply."></textarea></div>${btn('Save reflection','saveJournal')}`);}

function validatePuzzle(p){if(!p||typeof p!=='object'||typeof p.id!=='string'||!/^[A-Za-z0-9_-]{1,90}$/.test(p.id)||typeof p.fen!=='string'||!Array.isArray(p.moves)||!p.moves.length||p.moves.length>100||p.moves.length%2!==1)throw Error('Invalid puzzle record.');const g=new KRChess(p.fen);for(const m of p.moves)if(typeof m!=='string'||!/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(m)||!g.move(m))throw Error('Invalid puzzle line '+p.id);if(p.goal==='mate'&&!g.isCheckmate())throw Error('A claimed mate is not checkmate: '+p.id);return{id:p.id,title:String(p.title||'Imported position').slice(0,200),theme:String(p.theme||'calculation').replace(/[^a-zA-Z0-9]/g,'').slice(0,40)||'calculation',tags:Array.isArray(p.tags)?p.tags.map(x=>String(x).slice(0,50)).slice(0,30):[],fen:p.fen,moves:p.moves,difficulty:clamp(p.difficulty||2,1,3),source:String(p.source||'Imported position').slice(0,250),explanation:String(p.explanation||'Replay the full line and identify the forcing moves.').slice(0,5000),prompt:p.prompt?String(p.prompt).slice(0,1500):undefined,goal:p.goal==='mate'?'mate':undefined,rating:p.rating?clamp(p.rating,0,4000):undefined,url:safeURL(p.url)?p.url:undefined,provisional:!!p.provisional,last:typeof p.last==='string'&&/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(p.last)?p.last:undefined};}
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++;}else if(quoted)quoted=false;else if(field==='')quoted=true;else field+=c;}else if(c===','&&!quoted){row.push(field);field='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field='';}else field+=c;}if(quoted)throw Error('Unclosed quote in CSV.');if(field||row.length){row.push(field);rows.push(row);}return rows;}
async function importCSVFile(file){if(file.size>8*1024*1024)throw Error('Use a CSV selection no larger than 8 MB.');const text=(await file.text()).replace(/^\uFEFF/,''),rows=parseCSV(text);if(rows.length<2)throw Error('The CSV contains no puzzle records.');const header=rows.shift().map(x=>x.trim()),indexes=Object.fromEntries(header.map((x,i)=>[x,i]));for(const k of ['PuzzleId','FEN','Moves'])if(!(k in indexes))throw Error('Expected a Lichess CSV header with PuzzleId, FEN and Moves.');const existing=new Set(allPuzzles().map(p=>p.id)),room=5000-S.imports.length;let added=[],bad=0,duplicates=0,skipped=0;const take=Math.min(rows.length,Math.max(0,room));modal('Importing your puzzle bank',`<p id="import-status">Checking positions and every solution move…</p><p class="subtext">Only legally replayable records are added. Keep this tab open.</p>`);
 for(let n=0;n<rows.length;n++){if(added.length>=room){skipped=rows.length-n;break;}const r=rows[n],get=k=>r[indexes[k]]||'';try{const id='lichess-'+get('PuzzleId').trim();if(existing.has(id)){duplicates++;continue;}const raw=get('Moves').trim().split(/\s+/),g=new KRChess(get('FEN').trim()),setup=g.move(raw.shift());if(!setup||!raw.length)throw Error('Invalid setup');const tags=get('Themes').split(/\s+/),theme=['mateIn1','mateIn2','fork','pin','skewer','discoveredAttack','promotion','hangingPiece'].find(t=>tags.includes(t))||'calculation',rating=+get('Rating');const p=validatePuzzle({id,title:'Lichess puzzle '+get('PuzzleId'),fen:g.fen(),moves:raw,last:setup.uci,tags,theme,rating,difficulty:rating<1200?1:rating<1900?2:3,source:'Imported Lichess database puzzle · CC0',url:get('GameUrl'),goal:tags.includes('mate')?'mate':undefined,explanation:'This is the published database solution, not a generated verbal explanation. Identify the checks, captures, tactical themes and defensive resources in the full line. Themes: '+tags.join(', ')});added.push(p);existing.add(id);}catch(e){bad++;}if(n%15===0){const el=$('#import-status');if(el)el.textContent=`Checked ${n+1} / ${rows.length}. ${added.length} valid new puzzles so far.`;await new Promise(r=>setTimeout(r,0));}}
 S.imports.push(...added);save();closeModal();logEvent(`Imported ${added.length} verified puzzle lines`,'import');modal('Puzzle bank imported',`<p>${added.length} puzzles added. ${duplicates} duplicates skipped. ${bad} invalid records skipped.${skipped?' '+skipped+' records left out because the 5,000-import limit was reached.':''}</p><div class="notice">${storageOk?'Saved locally. Export a new backup to keep this expanded bank.':'Storage is full or unavailable. Export a backup now; the new puzzles currently exist only in this tab.'}</div>${btn('Open puzzles','nav','puzzles')}${btn('Export backup','export','','secondary')}`);render();}
async function importBackupFile(file){if(file.size>15*1024*1024)throw Error('Backup is too large (maximum 15 MB).');const x=JSON.parse(await file.text()),d=normalizeState(x);for(let i=0;i<d.imports.length;i++)d.imports[i]=validatePuzzle(d.imports[i]);for(let i=0;i<d.saved.length;i++)d.saved[i]=validatePuzzle(d.saved[i]);if(!confirm('Replace this browser’s current progress with this backup? Export your current progress first to preserve it.'))return;stopWork();S=d;save();session.puzzle=null;session.review=null;session.opening=null;session.play=new KRChess();try{if(S.sessionGame?.pgn)session.play=KRChess.fromPGN(S.sessionGame.pgn);else if(S.sessionGame?.fen)session.play=new KRChess(S.sessionGame.fen);}catch{S.sessionGame=null;}session.playColor=S.sessionGame?.color==='b'?'b':'w';closeModal();nav('home');toast(storageOk?'Backup restored.':'Backup loaded in memory, but browser storage is unavailable.');}

document.addEventListener('change',e=>{if(e.target.id==='play-color'){stopWork();session.playColor=e.target.value;session.flip=session.playColor==='b';persistGame();render();maybeComputer();}if(e.target.id==='play-level'){session.playLevel=e.target.value;}if(e.target.id==='review-position'&&session.review){session.review.index=+e.target.value;render();}if(e.target.id==='pgn-input')save();});
$('#file-input').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(e.target.dataset.kind==='backup')await importBackupFile(f);else if(e.target.dataset.kind==='csv')await importCSVFile(f);else{if(f.size>400000)throw Error('Import one PGN no larger than 400 KB.');loadReview(await f.text());}}catch(err){closeModal();toast(err.message||'The file could not be read.');}});
document.addEventListener('keydown',e=>{const sq=e.target.closest('[data-a="square"]');if(!sq||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();let f=sq.dataset.id.charCodeAt(0)-97,r=+sq.dataset.id[1];const dir=session.flip?-1:1;if(e.key==='ArrowUp')r+=dir;if(e.key==='ArrowDown')r-=dir;if(e.key==='ArrowLeft')f-=dir;if(e.key==='ArrowRight')f+=dir;if(f>=0&&f<8&&r>=1&&r<=8)$('#sq-'+String.fromCharCode(97+f)+r)?.focus();});
window.addEventListener('beforeunload',()=>{if(session.page==='practice'&&session.practiceTab==='play')persistGame();save();});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
render();
// Exposed for transparent local testing and debugging, not remote telemetry.
window.KnightRead={get state(){return S;},get session(){return session;},rules:KRChess,version:APP_VERSION};

function resumePuzzle(){const s=session.puzzle;if(!s||s.finished||session.busy||s.g.turn()===s.side||s.index>=s.line.length)return;session.busy=true;const token=session.token;render();setTimeout(()=>{if(token!==session.token||session.puzzle!==s)return;const m=s.g.move(s.line[s.index]);session.busy=false;if(!m){s.status='Stored line could not be replayed. Restart or skip this exercise.';s.kind='error';}else{s.index++;s.status=`Opponent played ${m.san}. Continue the line.`;}render();},400);}
