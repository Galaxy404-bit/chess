 be pleased you found it before moving. Compare a revised move order or another candidate.","trap":"Do not label a defense “unlikely” to avoid analyzing it. In a critical position, your opponent may find it, and training against it improves your judgment.","transfer":"For each attempted combination, write the most annoying defense before checking the answer.","questions":[{"q":"Which defensive move should you analyze most carefully?","options":["The strongest plausible resource, even if it spoils your idea.","The move you hope the opponent plays.","Only the most common reply in a database."],"correct":0,"explain":"Calculation tests the idea against resistance, not cooperation."},{"q":"Your first candidate is refuted during analysis. Is that wasted effort?","options":["No; discovering the refutation before moving is useful.","Yes; ignore the defense and play it anyway.","Yes; only winning lines teach anything."],"correct":0,"explain":"Accurate rejection is part of good decision-making and can reveal a better move order."}]},{"id":"L52","stage":6,"title":"Compare branches at stable positions","theme":"calculation","minutes":8,"idea":"Different lines may end in positions with different kinds of advantage. One wins a pawn but leaves your king exposed; another keeps equality with active pieces. Compare the final positions using the same evaluation criteria rather than stopping each line at its most attractive moment.","method":"Carry forcing exchanges to a stable point. Record material, king safety, activity and the opponent’s resources. Then return to the original position and compare the alternatives. Keep the move order clear so features do not leak between branches.","trap":"Do not mix two variations into a fictional position where you kept a piece that was exchanged in one of them.","transfer":"In a critical position, summarize the endpoint of two candidate lines before choosing.","questions":[{"q":"How should two candidate lines be compared?","options":["At stable endpoints using consistent evaluation criteria.","At the first moment one line looks exciting.","Only by the number of checks."],"correct":0,"explain":"Consistent endpoints prevent you from comparing a finished line with an unfinished tactical sequence."},{"q":"What is a common source of branch-calculation errors?","options":["Mixing piece locations or exchanges from different variations.","Knowing the board coordinates.","Writing a short summary of each endpoint."],"correct":0,"explain":"Each branch has its own board state. Reset to the root before analyzing another branch."}]},{"id":"L53","stage":6,"title":"Quiet moves and threats that cannot be met","theme":"calculation","minutes":8,"idea":"A quiet move does not immediately check or capture, yet it may improve a decisive threat, remove an escape square or put the opponent in a position where every reply fails. Finding it often requires first noticing why the immediate forcing move does not work.","method":"Start with the desired continuation and identify the obstacle. Can you remove it while preserving the threat? After the quiet move, examine the opponent’s forcing replies first; a threat is only strong if they cannot answer with something more urgent.","trap":"Do not assume a quiet move is profound merely because it is hard to see. It still needs a concrete purpose and a sound response to the opponent’s options.","transfer":"After a failed checking candidate, ask whether a preparatory move would fix its specific problem.","questions":[{"q":"How can you discover a strong quiet move?","options":["Identify why the desired follow-up fails and remove that obstacle.","Avoid all checks on principle.","Choose the least active piece at random."],"correct":0,"explain":"Quiet preparation often makes a previously ineffective threat work."},{"q":"What must be checked after a quiet attacking move?","options":["The opponent’s forcing replies and ways to meet the threat.","Only your intended next move.","Nothing, because quiet moves are safe."],"correct":0,"explain":"A slow threat loses its value if the defender can create an immediate stronger one."}]},{"id":"L54","stage":6,"title":"When to stop calculating","theme":"calculation","minutes":8,"idea":"You cannot calculate every branch to the end of the game. Stop a line when the forcing contact has ended and you can make a useful evaluation. Extend it when a hanging piece, check, promotion race or unresolved tactical threat makes the current score unreliable.","method":"Ask what remains unstable at the endpoint. If the answer is “my queen is attacked” or “the pawn promotes next move,” continue. If the position is quiet, compare strategic features and return to the other candidates instead of chasing an arbitrary depth.","trap":"A long variation is not necessarily a good variation. It can be based on weak replies and miss a short refutation near the root.","transfer":"For one calculated line, explain why you stopped where you did.","questions":[{"q":"Which endpoint usually requires further calculation?","options":["A position with an unresolved forcing threat or exchange.","A quiet position you can evaluate meaningfully.","A position reached after exactly five moves."],"correct":0,"explain":"Instability, not a fixed move count, tells you that the apparent evaluation may still change sharply."},{"q":"What makes a calculation useful?","options":["Accurate candidates, strong replies and a trustworthy conclusion.","Length alone.","The number of sacrifices in it."],"correct":0,"explain":"Depth is useful only when the line and its evaluation are reliable."}]},{"id":"L55","stage":6,"title":"Defend worse positions actively","theme":"defense","minutes":8,"idea":"Being worse does not remove your choices. Look for checks, simplification into a drawable ending, a fortress, a blockade, stalemate resources or counterplay against the opponent’s king. Make the winning task concrete rather than passively waiting.","method":"Identify what the opponent needs to accomplish. Preserve the resource that makes that task difficult. A material return may free your pieces or eliminate a dangerous passer. Test active defenses before committing to a position with no useful moves.","trap":"Do not confuse activity with desperation. An unsound attack that removes your last defensive resource can make the opponent’s task easier.","transfer":"In a worse position, name the opponent’s winning plan and one resource that interferes with it.","questions":[{"q":"What is a useful aim when defending a worse position?","options":["Preserve resources that make the opponent’s winning task difficult.","Avoid every exchange regardless of the ending.","Make random threats until something works."],"correct":0,"explain":"Active resistance, favorable simplification and concrete drawing ideas can all improve practical chances."},{"q":"Can returning material be a good defensive decision?","options":["Yes, if it removes the danger or reaches a sounder position.","No; material must never be given back.","Only if you are already winning."],"correct":0,"explain":"The result and activity matter more than retaining material that leaves you helpless."}]},{"id":"L56","stage":6,"title":"Calculation checkpoint: explain your decision","theme":"calculation","minutes":8,"idea":"A strong explanation identifies the position’s demand, the candidate chosen, the best opposing reply and the reason the final position is favorable. “It felt active” is not enough for a critical tactic; “the engine said so” is not a thought process you can reproduce over the board.","method":"Solve a mixed-theme puzzle without revealing the motif. State the complete line you expect and one alternative defense. Afterward, compare your analysis with the solution, and record whether the miss came from vision, candidates, calculation or evaluation.","trap":"Do not turn every miss into “I am bad at chess.” Name a trainable cause. An unseen backward knight move calls for different work from an incorrectly counted rook ending.","transfer":"Complete the checkpoint and save one specific calculation error in the journal.","questions":[{"q":"Which explanation is most useful?","options":["My move meets the threat; against their best reply, this line reaches a favorable endpoint.","The move is best because it looks impressive.","The app marked it correct, so no explanation is needed."],"correct":0,"explain":"An explanation should connect the decision to a reproducible thought process."},{"q":"How should you categorize a missed tactic?","options":["By the specific failure: vision, candidates, calculation or evaluation.","As proof that improvement is impossible.","Only by the rating of the opponent."],"correct":0,"explain":"A specific error category points toward an appropriate drill or habit."}]},{"id":"L57","stage":7,"title":"Lucena: shelter the king from checks","theme":"rookEndgame","minutes":8,"idea":"The Lucena family of rook endings concerns winning with a pawn on the seventh rank, the stronger king in front of it, and the defending king cut off. A common winning mechanism is building a bridge: your rook eventually interposes against side checks so the pawn can promote.","method":"Study the exact position before applying the name. Notice where the defending rook can check, how your king leaves the promotion square and where your rook must stand to block the checks. Practice the mechanism rather than memorizing one move order.","trap":"Not every rook-and-seventh-rank-pawn position is Lucena or winning. Rook pawns, king placement and the defender’s checking distance can change the result.","transfer":"In a suitable rook ending, explain where the checking rook’s line must be blocked.","questions":[{"q":"What is the purpose of building a bridge?","options":["Shelter the stronger king from rook checks so the pawn can promote.","Create an extra rook.","Force every rook ending to become a pawn ending."],"correct":0,"explain":"The rook interposes on a checking line, allowing the king and pawn to complete the promotion plan."},{"q":"Can you identify a winning Lucena mechanism by pawn rank alone?","options":["No; king and rook geometry also matter.","Yes; every seventh-rank pawn wins.","Yes; the defending king’s location is irrelevant."],"correct":0,"explain":"The standard mechanism requires a specific arrangement and can fail when the geometry changes."}]},{"id":"L58","stage":7,"title":"Philidor: deny the king, then check from behind","theme":"rookEndgame","minutes":8,"idea":"In the classical Philidor defensive setup, the defender keeps the king in front of the pawn and uses the rook on the third rank from the defender’s side to keep the attacking king out. When the pawn advances far enough, the rook can switch to checks from behind.","method":"Understand the timing: first deny king entry; then, after the pawn push removes the attacker’s shelter, deliver rear checks. Identify which rank is meant from the defender’s perspective and whether the defender has enough checking distance.","trap":"Do not blindly place a rook on the third rank in every position. If the attacking king has already crossed or the geometry differs, another defensive method may be required.","transfer":"Describe what changes in the position that tells the defending rook to switch from restriction to checks.","questions":[{"q":"What is the initial job of the rook in the classical Philidor defense?","options":["Keep the attacking king from advancing past the defensive rank.","Give random checks from any distance.","Stand directly in front of its own king forever."],"correct":0,"explain":"The defensive setup first denies king entry, preserving the later checking resource."},{"q":"Why can rear checks become effective after the pawn advances?","options":["The attacking king may lose the shelter it needed from checks.","The rook gains diagonal movement.","Promotion becomes illegal."],"correct":0,"explain":"The pawn’s advance changes the available shelter and timing. The exact position must still be checked."}]},{"id":"L59","stage":7,"title":"Exchange decisions: choose the ending first","theme":"strategy","minutes":8,"idea":"An exchange transforms the position. Trading your active piece for the opponent’s passive one can remove your advantage; exchanging their only defender can make a win simple. A transition to a pawn ending demands especially concrete calculation because pawn endings leave few reserve resources.","method":"Before exchanging, imagine the pieces already removed. Compare king activity, pawn races, weaknesses and remaining defensive possibilities. Decide whether the resulting position supports your desired result, not whether the trade feels simplifying.","trap":"Do not trade into a king-and-pawn ending based only on being a pawn up. Opposition, outside passers, rook-pawn exceptions and move order can make the ending drawn or lost.","transfer":"At one exchange opportunity, evaluate the resulting position before evaluating the trade itself.","questions":[{"q":"How should you judge a major exchange?","options":["Evaluate the resulting position and remaining plans.","Assume fewer pieces always helps the stronger player.","Choose whichever capture happens fastest."],"correct":0,"explain":"An exchange is good or bad because of the position it creates."},{"q":"Does an extra pawn guarantee a winning pawn ending?","options":["No; king placement, structure and move order can decide the result.","Yes, without exceptions.","Only if both players have castled earlier."],"correct":0,"explain":"Pawn endings are concrete. The nominal material edge is only one part of the evaluation."}]},{"id":"L60","stage":7,"title":"Positional sacrifices need compensation","theme":"strategy","minutes":8,"idea":"A positional sacrifice gives material for enduring benefits rather than an immediate forced recovery: activity, a blockade, weak squares, king exposure or dangerous passed pawns. You must identify what the opponent can and cannot consolidate.","method":"Separate concrete compensation from wishful thinking. Count active pieces, targets and entry squares; inspect defensive exchanges and whether the opponent can return some material to neutralize the pressure. Compare the sacrifice with a sound non-sacrificing candidate.","trap":"Do not justify every sacrifice with “initiative.” Compensation should have a specific mechanism and enough duration to matter.","transfer":"When considering a sacrifice, state what you receive, how the opponent may neutralize it and your fallback plan.","questions":[{"q":"What is a meaningful claim of compensation?","options":["Specific activity, targets or structural control that persists against defense.","The position looks complicated.","Sacrifices are automatically more advanced."],"correct":0,"explain":"Compensation needs a concrete explanation, not just aesthetic appeal or complexity."},{"q":"What defensive idea must a sacrifice calculation include?","options":["The opponent returning some material to extinguish the pressure.","Only accepting and keeping everything forever.","No exchanges, because you are attacking."],"correct":0,"explain":"The defender may choose the best practical position rather than maximize material."}]},{"id":"L61","stage":7,"title":"Practical decisions without self-deception","theme":"calculation","minutes":8,"idea":"The objectively best move and the easiest move to play may differ. With limited time, a clear favorable ending can be a better practical choice than an unclear attack requiring perfect calculation. Practical judgment does not make an unsound move objectively correct.","method":"Compare expected difficulty for both players, clock times, the safety of your king and the clarity of your plan. When you can force a simple win, prefer it over unnecessary complications. When clearly worse, retaining meaningful counterplay may be more practical than a passive simplification.","trap":"Do not use “practical” as a blanket excuse for moves you did not calculate. Explain the trade-off honestly.","transfer":"In your journal, separate your evaluation of a move from why you chose it under the clock.","questions":[{"q":"What is a defensible practical choice when clearly winning and low on time?","options":["A simpler reliably winning line over a risky complex one.","Any flashy sacrifice that creates confusion.","Avoiding all exchanges regardless of the ending."],"correct":0,"explain":"The aim is to secure the result while reducing unnecessary decision difficulty."},{"q":"Does calling a move “practical” prove it is objectively sound?","options":["No; practical difficulty and objective evaluation are different.","Yes; any confusing move is best.","Only in online chess."],"correct":0,"explain":"You can discuss practical merits without disguising a concrete tactical flaw."}]},{"id":"L62","stage":7,"title":"Review your games before the engine does","theme":"review","minutes":8,"idea":"Your games reveal which knowledge fails under real decision pressure. First review without an engine: identify critical positions, your intended plan, alternatives and what you overlooked. Then compare with a strong engine to test the analysis, not to replace it.","method":"Choose one or two turning points. Write your original thought and a better process. Use engine lines at sufficient depth, inspect the opponent’s defenses and replay the position. Shallow evaluations are provisional, especially in sacrifices, fortresses and long endings.","trap":"Do not treat every small evaluation change as equally important or an engine score as a player rating. Focus on repeatable errors with practical impact. Never use an engine to assist an ongoing rated game.","transfer":"Import a completed PGN, annotate one critical moment yourself and then compare the analysis.","questions":[{"q":"What should come before engine analysis in a learning review?","options":["Your own reconstruction of critical decisions and candidate moves.","Deleting every game you lost.","Guessing a performance rating from the final score."],"correct":0,"explain":"Self-analysis exposes the thought process that a numerical engine evaluation cannot directly observe."},{"q":"Can a shallow engine review reliably assign your true playing Elo?","options":["No.","Yes, from a single game.","Yes, if the evaluation graph is smooth."],"correct":0,"explain":"Engine agreement and evaluation loss are not an official or reliable player rating."}]},{"id":"L63","stage":7,"title":"Build a personal error curriculum","theme":"review","minutes":8,"idea":"A useful mistake journal turns observations into training decisions. Separate tactical blindness, calculation errors, evaluation errors, opening unfamiliarity, endgame knowledge and clock habits. Repeated causes deserve more attention than isolated curiosities.","method":"For each important error, record the position, your thought, the missing idea and a replacement habit. Practice the position later without the answer visible. Add a different position with the same idea so you learn the concept rather than the screenshot.","trap":"Do not keep an ever-growing list you never revisit. A small review queue with delayed retrieval is more useful than a large graveyard of mistakes.","transfer":"Choose your two most common error categories and give each a specific drill or habit for the coming week.","questions":[{"q":"What should a useful mistake entry contain?","options":["The position, original thought, missing idea and replacement habit.","Only “blunder” and the game result.","Only the opponent’s username."],"correct":0,"explain":"The entry should tell you what to practice and what to do differently next time."},{"q":"Why practice a different position with the same motif?","options":["To test transfer rather than memorizing one diagram.","To avoid ever reviewing the original.","Because the original answer is no longer legal."],"correct":0,"explain":"Transfer shows whether you learned the concept beyond its original visual arrangement."}]},{"id":"L64","stage":7,"title":"The 2000 goal: demonstrate, do not just complete","theme":"review","minutes":8,"idea":"Finishing a course is evidence of study, not a 2000 rating. Ratings belong to a particular platform, pool and time control; the same number is not interchangeable everywhere. Reaching your goal requires bringing the ideas into real games over time.","method":"Use a sustainable loop: study one weakness, solve a small set carefully, play a serious game, review your decisions and revisit errors after a delay. Track your actual rapid rating separately from course XP. Periodically test unfamiliar positions and endings without hints.","trap":"Do not chase a deadline or a progress badge at the expense of understanding. Progress can be uneven. If results stall, use your game evidence to adjust the work rather than repeating everything indiscriminately.","transfer":"Take the final checkpoint, review your weak categories and set the next cycle from your actual games.","questions":[{"q":"What does completing this course establish?","options":["That you completed its study and checks, not that you have an official 2000 rating.","A guaranteed 2000 rating on every platform.","That you no longer need game analysis."],"correct":0,"explain":"Course progress and competitive strength measure different things. Your real playing results establish your platform rating."},{"q":"What is the most useful next step after a plateau?","options":["Review recent games to identify the recurring bottleneck and adjust training.","Repeat the same easy puzzles indefinitely.","Abandon analysis and change openings after every loss."],"correct":0,"explain":"Training should respond to evidence about the decisions that are limiting your results."}]}]};

function learnPage(){return`<div class="page-head"><div class="eyebrow">The guided path</div><h1>From rules to reasons.</h1><p class="subtext">Eight chapters. Sixty-four lessons. Each lesson gives you an idea, a decision method, a common trap, two checks, and a real-game assignment. Everything is open to browse; the recommended path is sequential.</p></div><div class="actions">${btn('Continue '+nextLesson().id,'lesson',nextLesson().id)}${btn('Take the starting-point check','diagnostic','','secondary')}</div><div class="notice">The numbers below are approximate study bands, not prerequisites or measured Elo. Finishing a chapter means completing its learning checks—not proving a playing strength.</div>${CURRICULUM.stages.map((s,i)=>{let ls=CURRICULUM.lessons.filter(l=>l.stage===i);return`<section class="card stage-card"><div class="stage-top"><span class="stage-index">0${i+1}</span><div class="stage-info"><div class="eyebrow">${esc(s.band)}</div><h3>${esc(s.name)}</h3><p>${esc(s.subtitle)}</p></div><span class="pill ${stageDone(i)===8?'green':''}">${stageDone(i)} / 8 complete</span></div><div class="stage-lessons">${ls.map(l=>`<button class="lesson-link ${S.lessons[l.id]?.done?'complete':''} ${nextLesson().id===l.id?'current':''}" data-a="lesson" data-id="${l.id}"><span class="index">${S.lessons[l.id]?.done?'✓':l.id.slice(1)}</span><span>${esc(l.title)}</span><span class="time">${l.minutes} min</span></button>`).join('')}</div><div class="stage-footer"><small class="muted">${S.exams[i]?`Last checkpoint: ${S.exams[i].score} / 8`:'Check your understanding after the eight lessons.'}</small>${linkbtn('Chapter checkpoint '+icon('arrow'),'exam',i)}</div></section>`;}).join('')}`;}
function lessonQuestionHTML(q,i,key,answers,mode='lessonAnswer'){const ans=answers[i],order=optionOrder(key,i,q.options.length);return`<div class="question"><div class="eyebrow">Check ${i+1}</div><h4>${esc(q.q)}</h4>${order.map((original,display)=>`<button class="option ${ans?.choice===original?(original===q.correct?'correct':'wrong'):''}" data-a="${mode}" data-id="${i}:${original}" ${ans?.correct?'disabled':''}><span class="option-letter">${'ABCD'[display]}</span><span>${esc(q.options[original])}</span></button>`).join('')}${ans?`<div class="feedback ${ans.correct?'':'bad'}">${ans.correct?'Correct. ':mode==='examAnswer'?'Recorded. ':'Not yet. '}${esc(mode==='examAnswer'&&!ans.correct?'Review the explanation after submitting.':q.explain)}${!ans.correct&&mode!=='examAnswer'?' Read the idea again and choose the best answer.':''}</div>`:''}</div>`;}
function optionOrder(key,i,n){let hash=0;for(const c of key)hash=(hash*31+c.charCodeAt(0))>>>0;hash=(hash+i*131)>>>0;const out=Array.from({length:n},(_,i)=>i);for(let j=n-1;j>0;j--){hash=(Math.imul(1664525,hash)+1013904223)>>>0;const k=hash%(j+1);[out[j],out[k]]=[out[k],out[j]];}return out;}
function lessonPage(){const l=CURRICULUM.lessons.find(l=>l.id===session.lesson),done=S.lessons[l.id]?.done,pass=l.questions.every((q,i)=>session.lessonAnswers[i]?.correct),related=PUZZLES.filter(p=>p.theme===l.theme&&!p.variant).slice(0,3);return`<div class="breadcrumb">${linkbtn('Learning path','nav','learn')} <span>/</span> Chapter ${l.stage+1} <span>/</span> ${l.id}</div><div class="page-head"><div class="pill-row"><span class="pill green">${session.lessonReview?'Recall session':done?'Previously completed':'Guided lesson'}</span><span class="pill">${l.minutes} minute lesson</span><span class="pill">${esc(themeNames[l.theme]||l.theme)}</span></div><h1>${esc(l.title)}</h1></div><div class="lesson-layout"><section class="lesson-body">${session.lessonReview?'<div class="notice">Try the two questions from memory first. Open the lesson below only after making your attempt; revisiting the explanation counts as assisted recall.</div>':''}<div ${session.lessonReview?`${session.lessonRevealed?'':'hidden'} id="review-lesson-text"`:''}><div class="lesson-block"><div class="eyebrow">01 / The idea</div><h3>What you need to understand</h3><p>${esc(l.idea)}</p></div><div class="lesson-block"><div class="eyebrow">02 / The method</div><h3>How to make the decision</h3><p>${esc(l.method)}</p></div><div class="lesson-block"><div class="eyebrow">03 / The common trap</div><h3>What can go wrong</h3><p>${esc(l.trap)}</p></div></div>${session.lessonReview?btn('Revisit the explanation','showLesson','','secondary small'):''}<div class="section-head"><h2>Explain it back.</h2><span class="eyebrow">Two knowledge checks</span></div>${l.questions.map((q,i)=>lessonQuestionHTML(q,i,l.id,session.lessonAnswers)).join('')}<div class="card accent"><div class="eyebrow">04 / Transfer to a real game</div><div class="spacer"></div><p style="color:var(--text);margin-bottom:0">${esc(l.transfer)}</p></div><div class="spacer"></div><div class="actions"><button class="btn" data-a="completeLesson" ${!pass?'disabled':''}>${session.lessonReview?'Finish this recall':'Complete lesson'} ${icon('check')}</button>${done?btn('Next lesson','lesson',CURRICULUM.lessons[Math.min(63,Number(l.id.slice(1)))].id,'secondary'):''}</div><small class="muted">Both answers must be correct. Reading alone does not mark a lesson complete.</small></section><aside class="card sticky-card"><div class="eyebrow">Your thinking checklist</div><div class="spacer"></div><div class="taskrow"><span class="circle-num">1</span><div class="tasktext"><b>What changed?</b><small>Read the opponent’s last move.</small></div></div><div class="taskrow"><span class="circle-num">2</span><div class="tasktext"><b>What are my candidates?</b><small>Checks, captures, threats—then quiet ideas.</small></div></div><div class="taskrow"><span class="circle-num">3</span><div class="tasktext"><b>What is their best reply?</b><small>Make your idea survive resistance.</small></div></div><div class="side-detail"><hr class="divider"><h4>Use the board</h4>${related.length?related.map(p=>`<div style="margin:10px 0">${linkbtn(esc(p.title)+' →','puzzle',p.id)}</div>`).join(''):`<p>Practice this idea in a position of your own. Use the board and your game journal to connect the lesson to real decisions.</p>${btn('Open practice board','nav','practice','secondary small')}`}<hr class="divider"><small class="muted">A correct multiple-choice answer is a starting point. Can you use the same idea in a position you have not seen?</small></div></aside></div>`;}

function startExam(stage=null){stopWork();let qs;if(stage===null){const ids=['L01','L05','L09','L12','L17','L20','L26','L36','L41','L49','L58','L62'];qs=ids.map(id=>{const l=CURRICULUM.lessons.find(l=>l.id===id);return{...l.questions[0],lesson:l.id,stage:l.stage};});}else qs=CURRICULUM.lessons.filter(l=>l.stage===stage).map(l=>({...l.questions[1],lesson:l.id,stage:l.stage}));session.page='learn';session.exam={stage,qs,answers:{},submitted:false};session.lesson=null;render();window.scrollTo(0,0);}
function examPage(){const e=session.exam,score=Object.values(e.answers).filter(a=>a.correct).length,total=e.qs.length,ready=Object.keys(e.answers).length===total;let recommended=0;if(e.stage===null){const missed=e.qs.filter((q,i)=>!e.answers[i]?.correct);recommended=missed.length?missed[0].stage:6;}return`<div class="breadcrumb">${linkbtn('Learning path','nav','learn')} / ${e.stage===null?'Starting-point check':`Chapter ${e.stage+1} checkpoint`}</div><h1>${e.stage===null?'Find a useful starting point.':'Can you explain the chapter?'}</h1><p class="subtext">${e.stage===null?'Twelve reasoning questions suggest where to begin. This does not estimate your Elo or test your calculation on a real board.':'Eight questions, one from each lesson. Your first choice is final for this attempt. Aim for at least 7 / 8, then apply the ideas in your games.'}</p>${e.submitted?`<section class="card accent checkpoint-result"><strong>${score} / ${total}</strong><h3>${e.stage===null?'Your suggested starting chapter':score>=7?'Checkpoint passed':'Revisit the missed concepts'}</h3><p>${e.stage===null?esc(CURRICULUM.stages[recommended].name):'This score measures these knowledge checks only. It is not a playing-strength certificate.'}</p>${btn('Go to the recommended lesson','lesson',e.stage===null?CURRICULUM.lessons.find(l=>l.stage===recommended).id:e.qs.find((q,i)=>!e.answers[i]?.correct)?.lesson||CURRICULUM.lessons[Math.min(63,(e.stage+1)*8)].id)}</section>`:''}<div style="max-width:850px">${e.qs.map((q,i)=>{const a=e.answers[i],order=optionOrder('exam'+(e.stage??'d'),i,q.options.length);return`<div class="question"><div class="eyebrow">Question ${i+1} of ${total}</div><h4>${esc(q.q)}</h4>${order.map((oi,j)=>`<button class="option ${a?.choice===oi?(e.submitted?(a.correct?'correct':'wrong'):'current'):''}" ${a||e.submitted?'disabled':''} data-a="examAnswer" data-id="${i}:${oi}" style="${a?.choice===oi&&!e.submitted?'border-color:var(--accent)':''}"><span class="option-letter">${'ABC'[j]}</s function boardHTML(g,{decorative=false,empty=false,flip=session.flip,last=null,selected=session.selected,coords=S.settings.coords}={}){let targets=[];if(!decorative&&selected&&S.settings.legalDots&&!session.busy)targets=g.moves({square:selected,verbose:true}).map(m=>m.to);const ranks=flip?[1,2,3,4,5,6,7,8]:[8,7,6,5,4,3,2,1],files=flip?'hgfedcba':'abcdefgh',lastMove=last||g.hist.at(-1)?.uci,check=g.check()?krName(g.kings[g.side]):null;return`<div class="board ${session.boardHidden&&!decorative?'blind-board':''}" ${decorative?'':'role="group" aria-label="Interactive chessboard. Select a piece, then its destination. Arrow keys move focus."'}>${ranks.map((r,ri)=>[...files].map((f,fi)=>{const sq=f+r,p=empty?null:g.get(sq),dark=((f.charCodeAt(0)-97+r)%2)===1,isLast=lastMove&&(lastMove.slice(0,2)===sq||lastMove.slice(2,4)===sq);return`<button ${decorative?'tabindex="-1"':`id="sq-${sq}" data-a="square" data-id="${sq}"`} class="square ${dark?'dark':''} ${isLast?'last':''} ${selected===sq&&!decorative?'selected':''} ${targets.includes(sq)?'target':''} ${p?'occupied':''} ${check===sq&&!empty?'check':''}" ${!decorative?`aria-label="${sq}${p?', '+(p.color==='w'?'White':'Black')+' '+({p:'pawn',n:'knight',b:'bishop',r:'rook',q:'queen',k:'king'}[p.type]):', empty'}${selected===sq?', selected':''}"`:''}>${p?pieceSvg(p.type,p.color):''}${coords&&fi===0?`<span class="coord rank">${r}</span>`:''}${coords&&ri===7?`<span class="coord file">${f}</span>`:''}</button>`;}).join('')).join('')}</div>`;}

ns: 130 exercises in total. Variations reinforce a pattern; they are not 130 independent master-game puzzles. Import a Lichess CSV selection to expand the bank. Maximum 5,000 imported puzzles and 8 MB per file. The importer applies the opponent’s first move before showing the puzzle.</p></details>`;}
function puzzleWorkbench(s){const p=s.data,c=S.cards['p:'+p.id],completed=s.finished,theme=themeNames[p.theme]||p.theme,shownLine=s.revealed||completed;const objective=p.prompt||(p.goal==='mate'?(p.theme==='mateIn2'?'Find mate in two. Play your first move and then the mating finish.':'Find checkmate. Check every escape, capture and block.'):'Find the published continuation and play the entire line.');return`<div class="mobile-puzzle-intro"><span class="pill green">${esc(theme)}</span><h2>${esc(p.title)}</h2><p>${esc(objective)}</p></div><div class="workbench puzzle-workbench"><section class="board-col">${boardCard(s.g,{last:s.g.hist.length?null:p.last,name:completed?(s.revealed?'Solution study':'Line completed'):`${s.side==='w'?'White':'Black'} to move`,right:session.daily?`Daily practice · ${session.daily.count} / 5 complete`:s.g.check()?'King in check':'No clock. Think clearly.'})}<div class="board-tools">${btn(icon('flip')+' Flip','flip','','secondary small')}${btn(icon('bulb')+' Hint','puzzleHint','','secondary small')}${btn('Restart','restartPuzzle','','secondary small')}${btn(completed?'Next '+icon('arrow'):'Show line',''+(completed?'nextPuzzle':'revealPuzzle'),'','secondary small')}</div><div class="board-status ${s.kind}" role="status" aria-live="polite">${session.busy?'<span class="loading"></span>Opponent replies…':esc(s.status)}</div>${s.hintText?`<div class="hinttext">${esc(s.hintText)}</div>`:''}${moveStrip(s.g)}<div class="blind-area"><div class="row" style="justify-content:space-between"><label for="prediction">Blind calculation · predict the line first</label>${linkbtn(session.boardHidden?'Show pieces':'Hide pieces','toggleBlind')}</div><textarea id="prediction" placeholder="My candidate… Their best reply… My continuation…">${esc(s.prediction)}</textarea><small class="muted">Your private calculation note. Compare it with the revealed line; it is not auto-graded.</small></div></section><aside><div class="pill-row" style="margin-top:0"><span class="pill green">${esc(theme)}</span><span class="pill">${['','Foundation','Developing','Challenge'][p.difficulty]||'Practice'}</span>${p.variant?'<span class="pill">Geometry variation</span>':''}${p.provisional?'<span class="pill gold">Provisional engine reference</span>':''}</div><h2>${esc(p.title)}</h2><p class="subtext">${esc(p.prompt||(p.goal==='mate'?(p.theme==='mateIn2'?'Find mate in two. Play your first move and then the mating finish.':'Find checkmate. Check every escape, capture and block.'):'Find the published continuation and play the entire line.'))}</p>${p.rating?`<small class="muted">Source puzzle rating: ${p.rating}. This is a puzzle rating, not your playing Elo.</small>`:''}<section class="card"><div class="eyebrow">Before you commit</div><div class="taskrow"><span class="circle-num">1</span><div class="tasktext"><b>Read both sides</b><small>King safety, loose pieces, immediate threats.</small></div></div><div class="taskrow"><span class="circle-num">2</span><div class="tasktext"><b>Find a candidate</b><small>Ask what concrete feature makes it work.</small></div></div><div class="taskrow"><span class="circle-num">3</span><div class="tasktext"><b>Test their best defense</b><small>Visualize the position after the sequence.</small></div></div></section>${shownLine?`<section class="card accent" style="margin-top:16px"><div class="eyebrow">The explanation</div><div class="spacer"></div><h3>${s.revealed?'Study, then return tomorrow.':'Connect the move to the idea.'}</h3><p style="color:var(--text)">${esc(p.explanation)}</p><div class="notice"><b class="key">${esc(lineSAN(p.fen,s.line))}</b></div>${s.prediction?`<p><b>Your prediction:</b> ${esc(s.prediction)}</p>`:''}<div class="actions">${btn('Next exercise '+icon('arrow'),'nextPuzzle','','small')}${btn('Explore this position','practicePuzzle','','secondary small')}</div><small class="muted">${s.revealed?'Revealing schedules another attempt; it does not count as a solved puzzle.':s.errors||s.hints?'Completed with assistance. Return later without hints.':'Completed without hints or wrong moves. Delayed recall is still needed.'}</small></section>`:`<div class="notice">${p.source.startsWith('Teaching position')?'This is an objective-based teaching drill. Follow the stated goal; the reference line is not an engine judgment of every alternative.':'Finish every move on your side. Opponent replies are part of the calculation.'}</div>`}<div class="metric-row"><div class="metric"><b>${s.errors}</b><small>Wrong line attempts</small></div><div class="metric"><b>${s.hints}</b><small>Hints used</small></div><div class="metric"><b>${c?.step||0} / 5</b><small>Recall schedule step</small></div></div><p class="source">${esc(p.source)}${p.variant?` · Core pattern ${esc(p.baseId)}`:''}${p.url&&safeURL(p.url)?` · <a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">View source game ↗</a>`:''}</p></aside></div>`;}
function safeURL(u){try{const x=new URL(u);return x.protocol==='https:'&&['lichess.org','database.lichess.org','github.com','stockfishchess.org'].includes(x.hostname);}catch{return false;}}
function puzzleMove(uci){const s=session.puzzle;if(!s||s.finished||session.busy)return;const p=s.data,m=s.g.move(uci);if(!m)return;const mate=s.g.isCheckmate();let correct=uci===s.line[s.index]||(s.index===0&&p.accept?.includes(uci))||(p.goal==='mate'&&mate);if(s.index===0&&p.branches?.[uci]){const ds=p.branches[uci],d=ds[Math.floor(Math.random()*ds.length)];s.line=[uci,d.reply,d.win];correct=true;}
 if(!correct){s.g.undo();s.errors++;s.status=`${m.san} is legal, but it is not the requested/reference continuation. Recheck the objective and the opponent’s replies. This is not a verdict that every alternative loses.`;s.kind='error';render();return;}
 s.index++;s.kind='';s.status=`${m.san}${m.captured?' captures a '+({p:'pawn',n:'knight',b:'bishop',r:'rook',q:'queen'}[m.captured]||'piece'):''}${s.g.check()?' and gives check':''}. ${s.index<s.line.length?'Now calculate the response.':'The objective is complete.'}`;
 if((p.goal==='mate'&&mate)||s.index>=s.line.length){finishPuzzle(true);return;}
 session.busy=true;const token=session.token;render();setTimeout(()=>{if(token!==session.token||session.puzzle!==s)return;const opponent=s.g.move(s.line[s.index]);session.busy=false;if(!opponent){s.status='The stored line could not be replayed. Please skip this item and report its ID.';s.kind='error';render();return;}s.index++;s.status=`Opponent played ${opponent.san}. Your turn: find the continuation.`;s.kind='';render();},550);
}
function finishPuzzle(solved){const s=session.puzzle;s.finished=true;session.busy=false;session.boardHidden=false;s.revealed=!solved;if(!s.recorded){if(solved){const first=scheduleCard('p:'+s.data.id,s.errors===0&&s.hints===0);if(first)xp(15);if(session.daily)session.daily.count++;logEvent(`Completed: ${s.data.title}${s.errors||s.hints?' (assisted)':''}`,'puzzle');}else{let c=S.cards['p:'+s.data.id]||{attempts:0,solved:0,clean:0,step:0};c.attempts=(c.attempts||0)+1;c.step=0;c.due=now()+DAY;c.last=now();c.studied=true;S.cards['p:'+s.data.id]=c;logEvent(`Studied the solution: ${s.data.title}`,'study');}s.recorded=true;save();}s.kind=solved?'success':'';s.status=solved?(s.errors||s.hints?'Line completed with assistance. Explain the idea, then recall it later.':'Correct. You completed the line without hints or wrong moves.'):'Solution revealed. Study the reason, not just the coordinates; this is not recorded as a solved puzzle.';render();if(session.daily?.count===5)toast('Five drills complete. Now connect one idea to a real game.');}
function puzzleHint(){const s=session.puzzle;if(!s||s.finished||session.busy)return;s.hints++;const u=s.line[s.index],g=new KRChess(s.g.fen()),m=g.move(u);s.hintText=s.hints===1?`Theme: ${themeNames[s.data.theme]||s.data.theme}. ${s.data.prompt||'Start with checks, captures and threats, and test the most forcing candidate.'}`:s.hints===2?`Look at the piece on ${u.slice(0,2)}. What changes when it moves?`:`Reference move: ${m?.san||u}. Calculate the opponent’s reply before playing it.`;render();}
function restartPuzzle(){const s=session.puzzle;if(!s)return;stopWork();s.g=new KRChess(s.data.fen);s.line=[...s.data.moves];s.index=0;s.finished=false;s.revealed=false;s.kind='';s.status='Position reset. Hints and earlier errors stay attached to this attempt.';s.hintText='';session.boardHidden=false;render();}
function revealPuzzle(){const s=session.puzzle;if(!s||s.finished)return;stopWork();s.g=new KRChess(s.data.fen);for(const m of s.line)s.g.move(m);s.index=s.line.length;finishPuzzle(false);}
function nextPuzzle(){const p=choosePuzzle();if(!p){toast('No exercises match this queue. Change the filter.');return;}openPuzzle(p.id,true);}
let workerReject=null;
async function engineSearch(fen,opts={}){const initial=new KRChess(fen),terminal=initial.status();if(terminal.over)return{best:null,cp:terminal.type==='mate'?-30000:0,depth:0,pv:[],nodes:0,engine:remoteName||'Knight Read local',terminal:true};const time=clamp(opts.time||600,80,4000),maxDepth=clamp(opts.maxDepth||5,1,9);engineBusy=true;
 if(remoteWorker&&remoteName){return new Promise((resolve,reject)=>{const result={best:null,cp:0,depth:0,pv:[],nodes:0,engine:remoteName},t=setTimeout(()=>{remoteWaiter=null;engineBusy=false;remoteWorker?.terminate();remoteWorker=null;remoteName='';reject(Error('The optional engine did not finish. Switched back to the offline engine.'));},time+12000);remoteWaiter={resolve:r=>{clearTimeout(t);remoteWaiter=null;engineBusy=false;resolve(r);},reject:e=>{clearTimeout(t);remoteWaiter=null;engineBusy=false;reject(e);},result};remoteWorker.postMessage('ucinewgame');remoteWorker.postMessage('position fen '+fen);remoteWorker.postMessage('go movetime '+time);});}
 return new Promise((resolve,reject)=>{let url;try{url=URL.createObjectURL(new Blob([offlineWorkerSource],{type:'application/javascript'}));worker=new Worker(url);URL.revokeObjectURL(url);}catch(e){engineBusy=false;setTimeout(()=>{try{resolve(krSearch(fen,{time:Math.min(time,300),maxDepth,history:opts.history||[]}));}catch(err){reject(err);}},30);return;}
 const w=worker,t=setTimeout(()=>{w.terminate();if(worker===w)worker=null;workerReject=null;engineBusy=false;reject(Error('Local engine timed out. Please try again.'));},time+10000);workerReject=e=>{clearTimeout(t);workerReject=null;reject(e);};w.onmessage=e=>{clearTimeout(t);w.terminate();if(worker===w)worker=null;workerReject=null;engineBusy=false;if(e.data.error)reject(Error(e.data.error));else resolve(e.data.result);};w.onerror=e=>{clearTimeout(t);w.terminate();if(worker===w)worker=null;workerReject=null;engineBusy=false;reject(Error('The browser could not run the analysis worker.'));};w.postMessage({fen,time,maxDepth,history:opts.history||[]});});
}
async function loadRemoteEngine(){if(session.busy||engineBusy){toast('Finish or stop the current calculation first.');return;}if(remoteWorker){toast('The optional engine is already ready.');return;}modal('Optional online engine',`<p class="subtext">Download a legacy, single-threaded Stockfish 10.0.2 JavaScript build from jsDelivr. Analysis then runs on your device. Your games are not uploaded; the CDN receives the normal download request.</p><div class="notice warning">This is not the latest Stockfish. The download is optional and can fail on restricted networks or local-file browsers. The built-in engine and all lessons work without it.</div>${btn('Download & connect','connectRemote')}<p class="source">Stockfish is GPLv3. Source: <a href="https://github.com/lichess-org/stockfish.js" target="_blank" rel="noopener">lichess-org/stockfish.js</a>. Package: stockfish.js@10.0.2.</p>`);}
async function connectRemote(){closeModal();toast('Connecting the optional engine…');try{await new Promise((resolve,reject)=>{const url=URL.createObjectURL(new Blob([`importScripts('https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js');`],{type:'application/javascript'})),w=new Worker(url);URL.revokeObjectURL(url);let name='Stockfish legacy',ready=false;const fail=()=>{clearTimeout(t);w.terminate();if(remoteWorker===w)remoteWorker=null;remoteName='';reject(Error('The optional download was blocked or unavailable. The offline engine remains ready.'));},t=setTimeout(fail,20000);w.onerror=()=>{if(!ready)fail();else{remoteWorker=null;remoteName='';remoteWaiter?.reject(Error('The optional engine stopped. The offline engine remains available.'));}};w.onmessage=e=>{for(const line of String(e.data).split('\n')){if(line.startsWith('id name '))name=line.slice(8);if(line==='uciok')w.postMessage('isready');if(line==='readyok'&&!ready){ready=true;clearTimeout(t);remoteWorker=w;remoteName=name;resolve();}if(ready&&remoteWaiter){const r=remoteWaiter.result;let m;if((m=line.match(/\bdepth (\d+)/)))r.depth=+m[1];if((m=line.match(/\bnodes (\d+)/)))r.nodes=+m[1];if((m=line.match(/\bscore cp (-?\d+)/))){r.cp=+m[1];delete r.mate;}if((m=line.match(/\bscore mate (-?\d+)/))){r.mate=+m[1];r.cp=Math.sign(r.mate)*(30000-Math.abs(r.mate)*2);}if((m=line.match(/\bpv (.+)$/)))r.pv=m[1].trim().split(/\s+/);if(line.startsWith('bestmove ')){r.best=line.split(' ')[1];if(r.best==='(none)'||r.best==='0000')r.best=null;remoteWaiter.resolve(r);}}}};w.postMessage('uci');});toast(`${remoteName} connected. It runs locally after the download.`);render();}catch(e){toast(e.message);render();}}

function practicePage(){return`<div class="page-head"><div class="eyebrow">The practice room</div><h1>Put the ideas to work.</h1><p class="subtext">An opening should have a purpose. An endgame needs a method. A practice game should give you something to reflect on.</p></div><div class="tabs" role="tablist">${[['play','Play & endings'],['openings','Opening rehearsal'],['vision','Board vision']].map(([id,t])=>`<button class="tab ${session.practiceTab===id?'active':''}" role="tab" aria-selected="${session.practiceTab===id}" data-a="practiceTab" data-id="${id}">${t}</button>`).join('')}</div>${session.practiceTab==='play'?playPage():session.practiceTab==='openings'?openingPage():visionPage()}`;}
function playPage(){const g=session.play,st=g.status(),last=g.hist.at(-1);return`<div class="workbench"><section class="board-col">${boardCard(g,{name:session.playClaimed?'Draw claimed':st.text,right:session.busy?'Engine thinking…':`You play ${session.playColor==='w'?'White':'Black'}`})}<div class="board-tools">${btn(icon('flip')+' Flip','flip','','secondary small')}${btn('Undo turn','undoPlay','','secondary small')}${btn(icon('bulb')+' Candidate','playHint','','secondary small')}${btn('New game','newGame','','secondary small')}</div><div class="board-status" role="status">${session.busy?'<span class="loading"></span>Thinking…':esc(session.playStatus||'Before every move: what changed, what is threatened, and what is the best reply?')}</div>${moveStrip(g)}${st.claim&&!session.playClaimed?btn('Claim available draw','claimDraw','','secondary small'):''}<div class="actions">${btn('Review this game','reviewPractice','','secondary small')}${btn('Export PGN','exportPGN','','secondary small')}${btn('Load a FEN','loadFEN','','secondary small')}</div></section><aside><h2>Your thinking partner</h2><p class="subtext">A safe place to try ideas. No rating is awarded and the difficulty labels are not Elo estimates.</p><div class="row"><div class="field grow"><label for="play-color">Play as</label><select id="play-color"><option value="w" ${session.playColor==='w'?'selected':''}>White</option><option value="b" ${session.playColor==='b'?'selected':''}>Black</option></select></div><div class="field grow"><label for="play-level">Practice difficulty</label><select id="play-level">${[['gentle','Gentle'],['thinking','Thinking partner'],['challenge','Challenge']].map(([v,t])=>`<option value="${v}" ${session.playLevel===v?'selected':''}>${t}</option>`).join('')}</select></div></div>${engineNotice()}<section class="card accent"><div class="eyebrow">Endgame workshop</div><div class="spacer"></div><h3>Practice a technique</h3><p>Start from a focused position. Keep checking the opponent’s legal resources, not just your desired plan.</p><div class="endgame-grid">${ENDGAMES.map(e=>`<button class="listitem" data-a="endgame" data-id="${e.id}"><span>${esc(e.name)}</span></button>`).join('')}</div>${session.endgame?`<div class="opening-explain">${esc(session.endgame.goal)}</div>`:''}</section><div class="notice">Practice and analysis are for your own study or completed games. Do not use engine assistance during a live rated game.</div></aside></div>`;}
function persistGame(){const st=session.play.status();if(st.over||session.playClaimed)session.play.headers.Result=st.type==='mate'?(session.play.side===1?'0-1':'1-0'):'1/2-1/2';else delete session.play.headers.Result;S.sessionGame={pgn:session.play.hist.length?session.play.pgn():null,fen:session.play.fen(),color:session.playColor};save();}

async function maybeComputer(){if(session.page!=='practice'||session.practiceTab!=='play')return;const g=session.play;if(g.status().over){if(!session.playLogged){session.playLogged=true;persistGame();logEvent('Finished a practice game: '+g.status().text,'practice');}return;}if(session.playClaimed||g.turn()===session.playColor||session.busy)return;session.busy=true;const token=session.token,fen=g.fen();render();try{const level=session.playLevel,opts=level==='gentle'?{time:180,maxDepth:2}:level==='challenge'?{time:1500,maxDepth:6}:{time:650,maxDepth:4};const r=await engineSearch(fen,{...opts,history:g.keys.slice(0,-1)});if(token!==session.token||session.play!==g)return;let best=r.best;if(level==='gentle'&&!remoteName&&r.candidates?.length){const near=r.candidates.filter(x=>x.score>=r.cp-140);best=near[Math.floor(Math.random()*Math.min(3,near.length))]?.move||best;}const m=best?g.move(best):null;session.busy=false;session.playStatus=m?`The engine played ${m.san}. ${g.status().over?g.status().text:'What changed? Name its threat before choosing your move.'}`:'No legal engine reply was returned. Undo or start a new position.';persistGame();render();if(g.status().over&&!session.playLogged){session.playLogged=true;logEvent('Finished a practice game: '+g.status().text,'practice');}}catch(e){if(token!==session.token)return;session.busy=false;session.playStatus=e.message;render();}}

function openingPage(){if(!session.opening){const o=OPENINGS[0];session.opening={data:o,g:new KRChess(),index:0,errors:0,hints:0,finished:false,recorded:false,status:'Play the model White move. Start with the center.',lastNote:''};session.flip=false;}const s=session.opening,o=s.data;return`<div class="workbench"><section class="board-col">${boardCard(s.g,{name:`${o.side==='w'?'White':'Black'} repertoire`,right:`${Math.floor(s.index/2)} / 6 moves rehearsed`})}<div class="board-tools">${btn(icon('flip')+' Flip','flip','','secondary small')}${btn('Show this move','openingHint','','secondary small')}${btn('Restart line','opening',o.id,'secondary small')}</div><div class="board-status ${s.finished?'success':''}" role="status">${esc(s.status)}</div>${moveStrip(s.g)}${s.lastNote?`<div class="opening-explain">${esc(s.lastNote)}</div>`:''}${s.finished?`<div class="notice good">Line completed ${s.errors||s.hints?'with assistance':'without assistance'}. In a real game, the opponent can choose a different move. Re-evaluate instead of playing the memorized sequence automatically.</div>`:''}</section><aside><div class="pill-row"><span class="pill green">12 model lines</span><span class="pill">Ideas, not an opening database</span></div><h2>${esc(o.name)}</h2><p class="subtext">${esc(o.idea)}</p><div class="notice">Start with one White opening and one response to each of 1.e4 and 1.d4. You do not need to memorize all twelve lines. These six-move examples do not cover every defense.</div><div class="compact-list scroll-list">${OPENINGS.map(x=>`<button class="listitem ${x.id===o.id?'active':''}" data-a="opening" data-id="${x.id}"><span>${esc(x.name)}<br><small>${x.side==='w'?'White':'Black'} · six model moves</small></span><span>${S.openings[x.id]?.done?'✓':'→'}</span></button>`).join('')}</div><details><summary>How are my alternatives treated?</summary><p>Rehearsal checks the selected model line, not all good opening moves. A different legal move may be excellent chess, but it is not the line being rehearsed. The app says “different line,” not “blunder.”</p></details></aside></div>`;}
function openingMove(uci){const s=session.opening;if(!s||s.finished||session.busy)return;const g=s.g,m=g.move(uci);if(!m)return;if(uci!==s.data.moves[s.index]){g.undo();s.errors++;s.status=`${m.san} is a different line, not necessarily a bad move. Rehearse the selected model or explore your alternative in Play.`;render();return;}s.lastNote=s.data.notes[Math.floor(s.index/2)]||'Reconsider the center, development and king safety.';s.index++;s.status=`${m.san}: ${s.lastNote}`;render();advanceOpening();}
function advanceOpening(){const s=session.opening;if(!s)return;if(s.index>=s.data.moves.length){s.finished=true;session.busy=false;if(!s.recorded){const first=!S.openings[s.data.id]?.done;S.openings[s.data.id]={done:true,at:now(),clean:!s.errors&&!s.hints};if(first)xp(20);scheduleCard('o:'+s.data.id,!s.errors&&!s.hints);logEvent('Rehearsed '+s.data.name,'opening');s.recorded=true;}s.status='The model line is complete. Now explain the pawn structure and your next development job.';render();return;}if(s.g.turn()===s.data.side){session.busy=false;return;}session.busy=true;const token=session.token;render();setTimeout(()=>{if(token!==session.token||session.opening!==s)return;const m=s.g.move(s.data.moves[s.index]);s.index++;session.busy=false;s.status=`Opponent played ${m.san}. Continue your model line and name the purpose of your move.`;render();advanceOpening();},500);}
function startVision(){stopWork();session.page='practice';session.practiceTab='vision';session.vision={g:new KRChess(),target:randomSquare(),count:0,errors:0,start:now(),status:'Find the named square. Coordinates are hidden.',done:false};session.flip=Math.random()<.5;render();}

function visionPage(){if(!session.vision){session.vision={g:new KRChess(),target:randomSquare(),count:0,errors:0,start:now(),status:'Find the named square. Coordinates are hidden.',done:false};}const v=session.vision;return`<div class="workbench"><section class="board-col">${boardCard(v.g,{name:v.done?'Round complete':`Find ${v.target}`,right:`${session.flip?'Black':'White'} orientation · ${v.count} / 10`,empty:true,coords:false,last:'',selected:null})}<div class="board-status ${v.done?'success':''}">${esc(v.status)}</div><div class="board-tools">${btn(icon('flip')+' Flip','flip','','secondary small')}${btn('New round','startVision','','secondary small')}</div></section><aside><div class="eyebrow">Board vision</div><div class="spacer"></div><h2>${v.done?'A clearer mental board.':`Where is ${v.target}?`}</h2><p class="subtext">Tap the square. Learn its name from both orientations. This supports visualization; it is not a chess-strength test.</p><div class="metric-row"><div class="metric"><b>${v.count} / 10</b><small>Correct squares</small></div><div class="metric"><b>${v.errors}</b><small>Mistaps</small></div><div class="metric"><b>${v.done?Math.round((v.end-v.start)/1000):'—'}</b><small>Seconds after finish</small></div></div><section class="card"><h3>Build a mental picture</h3><p>Name the color of the target square. Then imagine a knight on it and name two legal destinations without moving a piece.</p><div class="notice">Square names never change when the board flips. a1 is always a1.</div>${btn('Read the board lesson','lesson','L01','secondary small')}</section></aside></div>`;}
function visionAnswer(sq){const v=session.vision;if(!v||v.done)return;if(sq===v.target){v.count++;if(v.count===10){v.done=true;v.end=now();v.status=`Ten squares found, ${v.errors} mistaps. Repeat from the other orientation.`;logEvent(`Board vision: 10 squares completed; ${v.errors} mistaps`,'vision');}else{v.status=`Correct: ${sq}. Find the next square.`;v.target=randomSquare();}}else{v.errors++;v.status=`That is ${sq}. Look again for ${v.target}.`;}render();}
function reviewPage(){return`<div class="page-head"><div class="eyebrow">The review room</div><h1>Turn mistakes into a method.</h1><p class="subtext">Recall what you learned. Then review a completed game without hiding your own reasoning behind an engine score.</p></div><div class="tabs">${[['queue',`Recall queue${dueTotal()?' · '+dueTotal():''}`],['games','My game review']].map(([v,t])=>`<button class="tab ${session.reviewTab===v?'active':''}" data-a="reviewTab" data-id="${v}">${t}</button>`).join('')}</div>${session.reviewTab==='queue'?queuePage():gameReviewPage()}`;}
function queuePage(){const ps=duePuzzles(),ls=dueLessons(),os=OPENINGS.filter(o=>isDue('o:'+o.id)),upcoming=Object.entries(S.cards).filter(([k,c])=>c.due>now()).sort((a,b)=>a[1].due-b[1].due).slice(0,8);return`<div class="grid2"><section class="card"><div class="section-head" style="margin-top:0"><h2>Ready for recall</h2><span class="pill green">${ps.length+ls.length+os.length} due</span></div>${!ps.length&&!ls.length&&!os.length?`<div class="empty">Nothing is overdue.<br><small>Finish a lesson or board drill today; its first revisit will appear tomorrow.</small></div>`:`<div class="compact-list">${ls.map(l=>`<button class="listitem" data-a="lessonReview" data-id="${l.id}"><span>${esc(l.title)}<br><small>Lesson recall · answer before rereading</small></span><span>→</span></button>`).join('')}${ps.slice(0,25).map(p=>`<button class="listitem" data-a="puzzle" data-id="${p.id}"><span>${esc(p.title)}<br><small>${esc(themeNames[p.theme]||p.theme)} · full-line recall</small></span><span>→</span></button>`).join('')}${os.map(o=>`<button class="listitem" data-a="opening" data-id="${o.id}"><span>${esc(o.name)}<br><small>Opening rehearsal</small></span><span>→</span></button>`).join('')}</div>`}${ps.length>25?`<div class="notice">Showing the first 25 of ${ps.length} due board drills. The next batch appears as you complete them.</div>`:''}</section><aside><section class="card accent"><div class="eyebrow">Remembering is not recognizing</div><div class="spacer"></div><h3>Make the idea survive a delay.</h3><p>Clean recall moves an item through 1, 3, 7, 14 and 30-day intervals. A wrong attempt or a hint resets the item to an early revisit. Repeating it immediately does not advance the interval.</p><p>Color and geometry variations are labeled. They help you recognize the same idea from a different angle, but they do not replace genuinely new positions.</p><small class="muted">This is a simple practice schedule, not a scientifically calibrated memory model or proof of mastery.</small></section><section class="card" style="margin-top:16px"><h3>Coming up</h3>${upcoming.length?upcoming.map(([key,c])=>{let title=key.startsWith('l:')?CURRICULUM.lessons.find(l=>l.id===key.slice(2))?.title:key.startsWith('o:')?OPENINGS.find(o=>o.id===key.slice(2))?.name:getPuzzle(key.slice(2))?.title;return title?`<div class="taskrow"><div class="tasktext"><b>${esc(title)}</b><small>${shortDate(c.due)} · recall step ${c.step||0}</small></div></div>`:'';}).join(''):'<p>New learning will build your review schedule.</p>'}</section></aside></div>`;}
function gameReviewPage(){const r=session.review;return`${!r?`<div class="grid2"><section class="card"><div class="eyebrow">Your completed game</div><div class="spacer"></div><h2>Bring your PGN.</h2><p>Paste one standard-chess game, or import a .pgn file. Everything stays in this browser. Variations and comments are accepted; the main line is replayed.</p><label for="pgn-input">PGN text</label><textarea id="pgn-input" style="min-height:210px" placeholder='[Event "My game"]\n\n1. e4 e5 2. Nf3 Nc6 …'>${esc(S.reviewDraft)}</textarea><div class="spacer"></div><div class="actions">${btn('Open game','loadPGN')}${btn('Import .pgn','importPGN','','secondary')}${btn('Try a teaching game','demoPGN','','ghost')}</div></section><aside class="card accent"><div class="eyebrow">Analyze yourself first</div><div class="spacer"></div><h3>The engine should challenge your explanation, not replace it.</h3><p>Find the first position where you were unsure. Write your candidate, your expected reply, and what you missed. Only then compare with an engine candidate.</p><p>Separate a thinking error from an evaluation number. “I ignored a loose piece” gives you a training action. “I lost 1.8” does not.</p>${engineNotice()}${btn('Study the analysis method','lesson','L62','secondary small')}</aside></div>`:reviewWorkbench(r)}`;}
function loadReview(pgn){const g=KRChess.fromPGN(pgn);const oldNotes=S.reviewDraft===pgn?S.reviewNotes||{}:{};stopWork();session.page='review';session.reviewTab='games';session.review={game:g,fens:[g.startFen,...g.hist.map(m=>m.after)],index:0,notes:oldNotes,results:{},progress:0,total:0,analyzing:false,status:'Replay your game. Choose a decision and explain your thinking before analyzing.'};session.flip=false;S.reviewDraft=pgn;S.reviewNotes=oldNotes;save();render();window.scrollTo(0,0);}
function evalText(result,fen){if(!result)return'—';const side=fen.split(' ')[1]==='w'?1:-1;if(result.mate!==undefined){const m=result.mate*side;return(m>0?'+':'−')+'M'+Math.abs(m);}if(Math.abs(result.cp)>29000)return(result.cp*side>0?'+':'−')+'mate';const v=result.cp*side/100;return(v>=0?'+':'')+v.toFixed(2);}
function whiteCP(result,fen){return result.cp*(fen.split(' ')[1]==='w'?1:-1);}
function reviewWorkbench(r){const i=r.index,g=new KRChess(r.fens[i]),move=r.game.hist[i],result=r.results[i],drop=result?Math.max(0,(whiteCP(result.before,r.fens[i])-whiteCP(result.after,r.fens[i+1]))*(g.side)):null;const logMoves=r.game.hist;return`<div class="actions" style="margin-bottom:15px">${btn('Open another game','clearReview','','secondary small')}${btn('Export game','exportReviewPGN','','secondary small')}${btn('Write an error journal entry','journalModal','','secondary small')}</div><div class="workbench"><section class="board-col">${boardCard(g,{last:i?r.game.hist[i-1].uci:null,name:move?`Before ${g.full}${g.side===1?'.':'…'} ${move.san}`:'Final position',right:`Position ${i} / ${logMoves.length}`})}<div class="board-tools">${btn('⏮','reviewIndex',0,'secondary small')}${btn('← Previous','reviewIndex',Math.max(0,i-1),'secondary small')}${btn('Next →','reviewIndex',Math.min(logMoves.length,i+1),'secondary small')}${btn('⏭','reviewIndex',logMoves.length,'secondary small')}${btn(icon('flip'),'flip','','secondary small')}</div><div class="field"><label for="review-position">Jump to a decision</label><select id="review-position">${logMoves.map((m,j)=>`<option value="${j}" ${j===i?'selected':''}>${m.before.split(' ')[5]}${m.color==='w'?'.':'…'} ${m.san} — ${m.color==='w'?'White':'Black'}</option>`).join('')}<option value="${logMoves.length}" ${i===logMoves.length?'selected':''}>Final position</option></select></div>${moveStrip(r.game,'reviewIndex',i)}<div class="board-status" role="status">${r.analyzing?`<span class="loading"></span>Analyzing ${r.progress} / ${r.total} positions. You can stop without losing finished results.`:esc(r.status)}</div>${r.analyzing?`<div class="progressbar"><i style="width:${r.progress/Math.max(1,r.total)*100}%"></i></div>${btn('Stop analysis','stopAnalysis','','secondary small')}`:''}</section><aside><div class="pill-row"><span class="pill green">${esc(r.game.headers.White||'White')} · ${esc(r.game.headers.Black||'Black')}</span><span class="pill">${logMoves.length} plies</span></div><h2>${move?'What was your idea?':'What will you train next?'}</h2><label for="review-note">Your reasoning, before the engine</label><textarea id="review-note" class="note-pad" placeholder="My candidate… Their strongest reply… The feature I overlooked…">${esc(r.notes[i]||'')}</textarea><div class="spacer"></div><div class="actions"><button class="btn" data-a="analyzeMove" ${!move||r.analyzing?'disabled':''}>Analyze this decision</button><button class="btn secondary" data-a="analyzeGame" ${r.analyzing?'disabled':''}>Scan game</button></div>${engineNotice()}${result?`<section class="analysis-card"><div class="eyebrow">Engine comparison · not a player rating</div><div class="metric-row"><div class="metric"><b>${evalText(result.before,r.fens[i])}</b><small>Before · White’s view</small></div><div class="metric"><b>${evalText(result.after,r.fens[i+1])}</b><small>After · White’s view</small></div><div class="metric"><b>${Math.abs(result.before.cp)>29000||Math.abs(result.after.cp)>29000?'Mate':(drop/100).toFixed(2)}</b><small>Approx. loss, mover</small></div></div><p class="subtext">Played <b>${esc(move.san)}</b>. Engine candidate: <b class="accent-text">${esc(lineSAN(r.fens[i],result.before.pv))}</b>.</p><p class="source">${esc(result.before.engine)} · before depth ${result.before.depth}, after depth ${result.after.depth} · ${result.budget} ms per position. A shallow comparison can change at a deeper search. No “accuracy %”, estimated game Elo, or personalized prose judgment is fabricated.</p><div class="actions">${btn('Save as a candidate drill','saveReviewDrill','','secondary small')}${btn('Explore this position','practiceReview','','secondary small')}</div></section>`:move?'<div class="notice">No analysis has been run for this move yet. Scores will appear only after the actual engine search finishes.</div>':''}<details><summary>What does “Scan game” do?</summary><p>It evaluates consecutive positions with a short time budget and compares their scores from the mover’s perspective. It scans up to 160 plies (80 full moves); later decisions remain available for individual analysis. It is an approximate first pass, not a full-depth adjudication. Completed analysis results stay in this tab; the PGN draft is saved locally.</p></details>${Object.keys(r.results).length?`<section class="card"><h4>Decisions worth revisiting</h4><div class="compact-list">${rankReview(r).slice(0,6).map(x=>`<button class="listitem" data-a="reviewIndex" data-id="${x.i}"><span>${esc(r.game.hist[x.i].before.split(' ')[5]+(r.game.hist[x.i].color==='w'?'.':'…')+' '+r.game.hist[x.i].san)}</span><small>${x.mate?'Mate transition':`≈ ${x.drop.toFixed(2)} change`}</small></button>`).join('')}</div><small class="muted">Ranked by the completed, provisional searches only.</small></section>`:''}</aside></div>`;}
function rankReview(r){return Object.entries(r.results).map(([i,x])=>{i=+i;const cp=(whiteCP(x.before,r.fens[i])-whiteCP(x.after,r.fens[i+1]))*(r.fens[i].split(' ')[1]==='w'?1:-1);return{i,drop:Math.max(0,cp/100),mate:Math.abs(x.before.cp)>29000||Math.abs(x.after.cp)>29000};}).sort((a,b)=>b.drop-a.drop);}
async function analyzeMove(){const r=session.review;if(!r||r.analyzing||r.index>=r.game.hist.length)return;const i=r.index,token=session.token;r.analyzing=true;r.total=2;r.progress=0;session.busy=true;render();try{const before=await engineSearch(r.fens[i],{time:1200,maxDepth:6});if(token!==session.token)return;r.progress=1;render();const after=await engineSearch(r.fens[i+1],{time:1200,maxDepth:6});if(token!==session.token)return;r.results[i]={before,after,budget:1200};r.progress=2;r.analyzing=false;session.busy=false;r.status='Comparison complete. Verify the candidate line and name a specific lesson for next time.';render();}catch(e){if(token!==session.token)return;r.analyzing=false;session.busy=false;r.status=e.message;render();}}
async function analyzeGame(){const r=session.review;if(!r||r.analyzing)return;const token=session.token,limit=Math.min(160,r.game.hist.length),cache=[],budget=350;r.analyzing=true;r.total=limit+1;r.progress=0;session.busy=true;render();try{for(let i=0;i<=limit;i++){cache[i]=await engineSearch(r.fens[i],{time:budget,maxDepth:4});if(token!==session.token)return;if(i>0)r.results[i-1]={before:cache[i-1],after:cache[i],budget};r.progress=i+1;render();}r.analyzing=false;session.busy=false;r.status=`Finished scanning ${limit} plies${limit<r.game.hist.length?' (the game is longer; analyze later moves individually)':''}. Use this as a first pass, not a final verdict.`;logEvent(`Scanned ${limit} plies of a completed game`,'analysis');render();}catch(e){if(token!==session.token)return;r.analyzing=false;session.busy=false;r.status=e.message;render();}}
function saveReviewDrill(){const r=session.review,i=r?.index,a=r?.results[i]?.before;if(!a?.best){toast('Analyze a decision first.');return;}if(S.saved.length>=500){toast('The saved-position limit is 500. Export a backup before removing older positions.');return;}const g=new KRChess(r.fens[i]),m=g.move(a.best);if(!m){toast('The engine candidate could not be validated.');return;}const id='saved-'+now();S.saved.push({id,title:`My game: before ${r.game.hist[i].san}`,theme:'custom',tags:['custom'],fen:r.fens[i],moves:[a.best],difficulty:2,provisional:true,source:`Saved from my PGN · ${a.engine}, depth ${a.depth}`,prompt:'Find the saved engine candidate. This is a one-move, provisional reference—not a verified unique solution.',explanation:`The stored candidate is ${m.san}. It came from a ${a.engine} search at depth ${a.depth}, so deeper analysis may prefer another move. Your note: ${r.notes[i]||'No note was added.'}`});logEvent('Saved a provisional candidate drill from my game','analysis');toast('Saved under Puzzles → My saved positions. Marked provisional.');render();}
function progressPage(){const complete=completedLessons().length,solved=solvedCount(),cards=Object.values(S.cards),clean=cards.reduce((n,c)=>n+(c.clean||0),0),attempts=cards.reduce((n,c)=>n+(c.attempts||0),0),themes=[...new Set(PUZZLES.map(p=>p.theme))],j=S.journal,dates=Array.from({length:42},(_,i)=>{const d=new Date();d.setDate(d.getDate()-41+i);return dayKey(d);});return`<div class="page-head"><div class="eyebrow">Your learning record</div><h1>Track the work that transfers.</h1><p class="subtext">Lesson checks, clean recall and real-game reflections. Your platform rating is self-reported and kept separate from training XP.</p></div><div class="stats"><div class="stat"><span class="num">${S.profile.rating}</span><span class="label">${esc(S.profile.platform)} · entered by you</span></div><div class="stat"><span class="num">${S.profile.goal}</span><span class="label">Long-term playing goal</span></div><div class="stat"><span class="num">${S.xp}</span><span class="label">Learning XP · not Elo</span></div><div class="stat"><span class="num">${attempts?Math.round(clean/attempts*100)+'%':'—'}</span><span class="label">Clean finishes among recorded attempts</span></div></div><div class="grid2"><section class="card"><h3>The curriculum</h3>${CURRICULUM.stages.map((s,i)=>`<div class="skillrow"><div class="row"><span>${i+1}. ${esc(s.name)}</span><span class="muted">${stageDone(i)}/8</span></div><div class="progressbar"><i style="width:${stageDone(i)/8*100}%"></i></div></div>`).join('')}<small class="muted">Completion means two knowledge checks passed. This bar does not measure practical mastery of an entire chapter.</small></section><section class="card"><h3>Your board-drill coverage</h3>${themes.map(t=>{const bank=PUZZLES.filter(p=>p.theme===t),n=bank.filter(p=>S.cards['p:'+p.id]?.solved).length;return`<div class="skillrow"><div class="row"><span>${esc(themeNames[t]||t)}</span><span class="muted">${n}/${bank.length}</span></div><div class="progressbar"><i style="width:${n/bank.length*100}%"></i></div></div>`;}).join('')}<small class="muted">Coverage includes labeled color/geometry variants. Bank completion is not tactical strength.</small></section></div><div class="section-head"><h2>Real-game journal</h2>${btn('Add a game reflection','journalModal','','secondary small')}</div><section class="card"><p>Write one actionable error: “I moved without checking the opponent’s capture,” not “I am bad at chess.” Your results belong here; a training engine does not assign them.</p>${j.length?`${ratingChart(j)}<div class="table-wrap"><table><thead><tr><th>DATE</th><th>RESULT</th><th>RATING</th><th>FOCUS</th><th>NEXT ACTION</th><th></th></tr></thead><tbody>${j.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.result)}</td><td>${esc(x.rating||'—')}</td><td>${esc(x.tag)}</td><td>${esc(x.note)}</td><td>${linkbtn('Delete','deleteJournal',x.id)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No game reflections yet. Your first honest review is more useful than an invented accuracy score.</div>'}</section><div class="grid2" style="margin-top:18px"><section class="card"><h3>Last six weeks</h3><div class="heatrow">${dates.map(d=>`<div class="heat ${S.activity[d]?'on':''} ${S.activity[d]>4?'high':''}" title="${d}: ${S.activity[d]||0} activities" aria-label="${d}: ${S.activity[d]||0} activities"></div>`).join('')}</div><p>${streak()} day study streak. There is no penalty for a rest day.</p><div class="actions">${btn(icon('save')+' Export backup','export','','secondary small')}${btn('Import backup','importBackup','','secondary small')}${btn('Profile','settings','','ghost small')}</div><div class="notice">Progress belongs to this browser and this file/site location. Clearing browser data, changing devices or moving to a hosted copy can lose access to it. Export a backup regularly.</div></section><section class="card"><h3>Recent work</h3><div class="timeline">${S.events.slice(0,8).map(e=>`<div class="event"><time>${shortDate(e function ratingChart(j){const pts=j.filter(x=>Number.isFinite(+x.rating)&&+x.rating>0);if(pts.length<2)return'<p class="tiny muted">Add at least two rated-game entries to see a rating trend.</p>';const min=Math.min(...pts.map(x=>+x.rating))-20,max=Math.max(...pts.map(x=>+x.rating))+20,xy=pts.map((p,i)=>[40+i/(pts.length-1)*560,100-(+p.rating-min)/(max-min)*80]);return`<svg class="rating-chart" viewBox="0 0 640 130" role="img" aria-label="Self-reported rating trend. First ${pts[0].rating}, most recent ${pts.at(-1).rating}."><line x1="40" y1="105" x2="600" y2="105" stroke="var(--line)"/><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent2)" stroke-width="2"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--accent)"/>`).join('')}<text x="40" y="124" fill="var(--muted)" font-size="10">${esc(pts[0].date)}</text><text x="600" y="124" text-anchor="end" fill="var(--muted)" font-size="10">${esc(pts.at(-1).date)}</text><text x="25" y="${xy[0][1]+4}" text-anchor="end" fill="var(--muted)" font-size="10">${pts[0].rating}</text></svg>`;}
