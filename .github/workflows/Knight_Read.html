 }if(bishops[1]>=2)score+=28;if(bishops[-1]>=2)score-=28;return score;
}
function krSearch(fen,{time=600,maxDepth=5,history=[]}={}){
 const g=new KRChess(fen),rootSide=g.side,deadline=Date.now()+time,val=[0,100,320,335,500,900,20000];let nodes=0;const tt=new Map(),path=new Map();
 for(const k of history)path.set(k,(path.get(k)||0)+1);
 function order(moves,pref){return moves.sort((a,b)=>((krUci(b)===pref?100000:0)+(b.captured?10*val[Math.abs(b.captured)]-val[Math.abs(b.piece)]:0)+(b.promotion?val[b.promotion]:0))-((krUci(a)===pref?100000:0)+(a.captured?10*val[Math.abs(a.captured)]-val[Math.abs(a.piece)]:0)+(a.promotion?val[a.promotion]:0)));}
 const tick=()=>{if((++nodes&255)===0&&Date.now()>deadline)throw 'timeout';};
 function quiesce(alpha,beta,ply,remaining){tick();const check=g.check(),all=g.legal();if(!all.length)return check?-30000+ply:0;if(g.insufficient()||g.half>=100)return 0;const stand=krEvaluate(g)*g.side;if(!check){if(stand>=beta)return beta;if(stand>alpha)alpha=stand;}if(remaining<=0)return check?stand-30:stand;for(const m of order(check?all:all.filter(m=>m.captured||m.promotion))){const u=g.make(m);let v;try{v=-quiesce(-beta,-alpha,ply+1,remaining-1);}finally{g.unmake(m,u);}if(v>=beta)return beta;if(v>alpha)alpha=v;}return alpha;}
 function neg(depth,alpha,beta,ply){tick();if(depth<=0)return quiesce(alpha,beta,ply,5);const moves=g.legal();if(!moves.length)return g.check()?-30000+ply:0;if(g.insufficient()||g.half>=100)return 0;const key=g.key();if((path.get(key)||0)>=2)return 0;const entry=tt.get(key),orig=alpha;if(entry&&entry.depth>=depth&&entry.flag==='exact'&&Math.abs(entry.score)<29000)return entry.score;
 path.set(key,(path.get(key)||0)+1);let best=-32000,bm='';try{for(const m of order(moves,entry?.move)){const u=g.make(m);let score;try{score=-neg(depth-1,-beta,-alpha,ply+1);}finally{g.unmake(m,u);}if(score>best){best=score;bm=krUci(m);}if(best>alpha)alpha=best;if(alpha>=beta)break;}}finally{path.set(key,path.get(key)-1);}if(tt.size<100000)tt.set(key,{depth,score:best,move:bm,flag:best<=orig?'upper':best>=beta?'lower':'exact'});return best;}
 let roots=g.legal();if(!roots.length)return{best:null,cp:g.check()?-30000:0,depth:0,pv:[],nodes:0,engine:'Knight Read local'};
 let result={best:krUci(roots[0]),cp:krEvaluate(g)*rootSide,depth:0,pv:[krUci(roots[0])],candidates:[],engine:'Knight Read local'};
 for(let depth=1;depth<=maxDepth;depth++){
  let ranked=[];try{for(const m of order(roots,result.best)){const u=g.make(m);let score;try{score=-neg(depth-1,-32000,32000,1);}finally{g.unmake(m,u);}ranked.push({move:krUci(m),score});if(Date.now()>deadline)throw'timeout';}}catch(e){if(e!=='timeout')throw e;break;}
  ranked.sort((a,b)=>b.score-a.score);let pv=[ranked[0].move],p=new KRChess(fen);p.move(pv[0]);for(let j=1;j<depth;j++){const next=tt.get(p.key())?.move;if(!next||!p.move(next))break;pv.push(next);}result={best:ranked[0].move,cp:ranked[0].score,depth,pv,candidates:ranked.slice(0,8),engine:'Knight Read local'};if(Math.abs(result.cp)>29000||Date.now()>deadline)break;
 }result.nodes=nodes;return result;
}
if(typeof module!=='undefined')module.exports={krEvaluate,krSearch};

self.onmessage=function(e){try{self.postMessage({result:krSearch(e.data.fen,e.data)});}catch(err){self.postMessage({error:String(err&&err.message||err)});}};
</script>
<script>
const CURRICULUM = {"stages":[{"name":"First principles","band":"Start → 600","subtitle":"See the board. Know the rules.","focus":"Legal moves, checkmate and a reliable thinking habit."},{"name":"Stop giving games away","band":"600 → 800","subtitle":"Safety before brilliance.","focus":"Threat awareness, loose pieces and safe exchanges."},{"name":"Make tactics make sense","band":"800 → 1000","subtitle":"Find the reason behind the combination.","focus":"Forks, pins, discovered attacks and forcing sequences."},{"name":"Get a playable position","band":"1000 → 1200","subtitle":"An opening is a plan, not a password.","focus":"Development, the center and a small, understandable repertoire."},{"name":"Finish the job","band":"1200 → 1400","subtitle":"Turn an advantage into a result.","focus":"Basic mates, king-and-pawn endings and rook activity."},{"name":"Find a plan","band":"1400 → 1600","subtitle":"Learn what the position is asking for.","focus":"Pawn structures, pieces, weaknesses and prophylaxis."},{"name":"Calculate with discipline","band":"1600 → 1800","subtitle":"See farther without guessing.","focus":"Candidate moves, defensive resources and clear evaluation."},{"name":"Build competitive strength","band":"1800 → 2000 goal","subtitle":"Bring knowledge into real games.","focus":"Advanced endgame ideas, practical decisions and a personal feedback loop."}],"lessons":[{"id":"L01","stage":0,"title":"Your board, your coordinates","theme":"basics","minutes":6,"idea":"The board is a map. Files run a–h from White’s left to right; ranks run 1–8 from White’s side. A square keeps its name when you flip the board. White starts on ranks 1 and 2, and moves first. Keep a light square at the near-right corner.","method":"Locate the four central squares: d4, e4, d5 and e5. Say a piece’s starting square and destination before moving it. In this app, tap a piece and then a destination; the dots are legal destinations, not recommendations.","trap":"Do not rename squares when playing Black. The square a1 is still a1, even when it appears at the top right of your screen.","transfer":"Before your next game, find both kings and name the four center squares without moving a piece.","questions":[{"q":"You flip the board to play Black. What happens to the name e4?","options":["It remains e4.","It becomes d5.","It depends on whose turn it is."],"correct":0,"explain":"Coordinates belong to the board, not to your viewing angle."},{"q":"What does a legal-move dot tell you?","options":["The move is allowed by the rules.","The move is strategically best.","The destination is safe from capture."],"correct":0,"explain":"A legal move can still lose a piece or the game. Legality and quality are separate questions."}]},{"id":"L02","stage":0,"title":"Rooks, bishops and queens","theme":"basics","minutes":6,"idea":"A rook travels horizontally or vertically. A bishop travels diagonally and stays on one square color. A queen combines both. Sliding pieces cannot jump over occupied squares. They can capture an enemy on the first occupied square along their path.","method":"Trace the entire ray, not just the destination. Ask: is the path clear, is the target friendly or enemy, and would moving expose my king? Long-range pieces become stronger when their lines open.","trap":"A queen’s apparent reach is interrupted by your own pieces. A bishop behind a locked pawn chain may have very few useful squares.","transfer":"For one quiet position, trace every unobstructed line from both bishops and rooks.","questions":[{"q":"Your rook is on a1 and your pawn is on a2. Can the rook move to a5?","options":["No; the pawn blocks the file.","Yes; rooks may jump friendly pawns.","Only if a5 is empty."],"correct":0,"explain":"A rook cannot cross a piece. An empty destination does not make a blocked path legal."},{"q":"Which piece is restricted to one color of square throughout the game?","options":["A bishop.","A rook.","A queen."],"correct":0,"explain":"A diagonal changes file and rank together, so the bishop never changes square color."}]},{"id":"L03","stage":0,"title":"Knights and kings","theme":"basics","minutes":6,"idea":"A knight moves two squares in one direction and one perpendicular to it. It can jump over other pieces. A king moves one square in any direction, but may not move into an attacked square. The kings therefore cannot stand next to each other.","method":"For a knight, name its possible landing squares rather than drawing a winding path. For a king, inspect enemy attacks on every candidate destination. An enemy piece still attacks squares even when moving that piece would expose its own king.","trap":"Do not assume an undefended enemy piece is safe for your king to capture. The destination may be attacked by a different piece or by the enemy king.","transfer":"In a position with a central knight, name all eight potential destinations before checking which are legal.","questions":[{"q":"Which piece can jump over intervening pieces during an ordinary move?","options":["A knight.","A queen.","A bishop."],"correct":0,"explain":"The knight’s move depends on the destination; intervening squares do not block it."},{"q":"Can two kings occupy adjacent squares?","options":["No; each would attack the other.","Yes, if neither is defended.","Yes, when only kings remain."],"correct":0,"explain":"A king may not move into check. A king attacks all adjacent squares."}]},{"id":"L04","stage":0,"title":"Pawns: small moves, permanent choices","theme":"promotion","minutes":6,"idea":"Pawns move forward but capture one square diagonally forward. A pawn on its starting rank may move two squares if both are empty. White moves toward rank 8; Black toward rank 1. Pawns never move backward. On the farthest rank, a pawn must become a queen, rook, bishop or knight.","method":"Separate movement from attacks: a pawn does not attack the square directly in front. Before a push, check what squares it stops defending and which enemy pieces it attacks afterward. Choose a promotion for the actual position, not just the usual piece value.","trap":"Promoting to a queen can occasionally create stalemate. Promotion is not restricted to pieces you have already lost, and you may have multiple queens.","transfer":"Before each pawn move, name one square it will no longer defend.","questions":[{"q":"A white pawn on e4 attacks which squares?","options":["d5 and f5.","e5 only.","d3 and f3."],"correct":0,"explain":"White pawns capture toward higher-numbered ranks, diagonally rather than straight ahead."},{"q":"Which promotion is permitted?","options":["A knight, even if both original knights survive.","A king, if the original king is trapped.","Only a piece previously captured."],"correct":0,"explain":"Promotion allows queen, rook, bishop or knight. Captured material places no restriction."}]},{"id":"L05","stage":0,"title":"Check is a question you must answer","theme":"defense","minutes":6,"idea":"Check means your king is attacked. Your next move must remove every attack on the king. The three basic responses are to move the king, capture the checking piece, or block the line of a sliding checker. A knight’s check cannot be blocked.","method":"Identify the checker first. Then test all three types of response. After choosing one, inspect the new position: a capture or block can be illegal because it uncovers another line toward your king.","trap":"Attacking the enemy queen is not an answer to check unless the same move also removes the check. In double check, only a king move can resolve both attacks.","transfer":"Whenever checked, name the checker before touching a piece.","questions":[{"q":"Your king is checked by a knight. Which response is impossible?","options":["Blocking the knight’s attack with another piece.","Capturing the knight legally.","Moving the king to a safe square."],"correct":0,"explain":"A knight jumps, so no interposed piece can block its attack."},{"q":"In double check, what kind of legal reply must you find?","options":["A king move.","Any attack on the enemy queen.","A block against either checker."],"correct":0,"explain":"Both attacks must disappear. A move by a different piece cannot neutralize both checks in a legal double-check position."}]},{"id":"L06","stage":0,"title":"Checkmate, stalemate and draws","theme":"mateIn1","minutes":6,"idea":"Checkmate is check with no legal escape. Stalemate is no legal move while the king is not in check; that is a draw. You win by mating the king, not by accumulating the most material. Some positions are drawn because neither side can possibly mate.","method":"To verify mate, check captures of the attacker, interpositions, and every king escape. To avoid stalemate when far ahead, ask whether the opponent has any legal move after your quiet move. Repetition and move-count draw rules also matter: this app separates claimable draws from automatic ones.","trap":"Do not call a position mate merely because the king cannot move. The defender may capture or block with another piece. Conversely, stalemate requires no legal move by any piece, not just the king.","transfer":"Before your final move in a winning ending, say: “Check, legal replies, stalemate?”","questions":[{"q":"The defender has no legal moves, but the king is not attacked. What is the result?","options":["Stalemate: a draw.","Checkmate: a win for the attacker.","The defender skips a turn."],"correct":0,"explain":"No legal move is not enough for mate; the king must also be in check."},{"q":"How do you verify a claimed checkmate?","options":["Test king escapes, captures and blocks.","Only count the attacker’s pieces.","Only check whether the king can move."],"correct":0,"explain":"Other defending pieces can sometimes capture the checker or block a sliding attack."}]},{"id":"L07","stage":0,"title":"Castling and en passant","theme":"basics","minutes":6,"idea":"Castling moves king and rook in one move. The king goes two squares toward the rook; the rook lands beside it. Neither may have moved, the path must be clear, and the king may not castle out of, through, or into check. A rook being attacked does not itself forbid castling.","method":"En passant applies immediately after an enemy pawn advances two squares and lands next to your pawn on its fifth rank. Your pawn captures as though the enemy had advanced one square. The captured pawn is removed from the adjacent square. The capture is optional and must still leave your king safe.","trap":"Castling rights do not return if a king or rook moves away and comes back. En passant is available for just the next move, not indefinitely.","transfer":"Before castling, check the king’s starting square, transit square and landing square for attacks.","questions":[{"q":"Your king would cross an attacked square while castling. Is castling legal?","options":["No.","Yes, if the landing square is safe.","Yes, if the rook is defended."],"correct":0,"explain":"The king may not start in check, cross an attacked square, or finish in check."},{"q":"You decline an available en passant capture and play another move. Can you take it later?","options":["No; that opportunity has expired.","Yes, while the pawn remains beside yours.","Yes, if your pawn has never moved twice."],"correct":0,"explain":"En passant must be played immediately after the qualifying two-square pawn advance."}]},{"id":"L08","stage":0,"title":"Read a move; build a thought routine","theme":"safety","minutes":6,"idea":"In algebraic notation, N means knight, B bishop, R rook, Q queen and K king; a pawn move has no piece letter. “x” means capture, “+” check, “#” mate, and O-O castling kingside. Nf3 means a knight moves to f3. Nbd2 identifies the knight from the b-file.","method":"Use a repeatable routine: What changed? What does the opponent threaten? What are my forcing options? What is their best answer? Is my intended move safe? Early on, a reliable two-ply check is more useful than an impressive but imaginary ten-move line.","trap":"Do not start with your own attack every turn. An opponent’s quiet move may create a threat, uncover a line or remove a defender.","transfer":"Use the routine aloud in practice, then silently in your next slow game.","questions":[{"q":"What does Nxf7+ mean?","options":["A knight captures on f7 and gives check.","A king moves to f7 without capturing.","A pawn from the n-file captures on f7."],"correct":0,"explain":"N identifies a knight, x a capture, f7 the destination and + check."},{"q":"What should you ask immediately after the opponent moves?","options":["What changed, and what do they threaten?","How can I give check as quickly as possible?","Which memorized opening move comes next?"],"correct":0,"explain":"Their move may change the tactical and strategic needs of the position. Reassess before following your own plan."}]},{"id":"L09","stage":1,"title":"The opponent gets a move too","theme":"safety","minutes":6,"idea":"A move is not good because your idea is attractive. It must survive the opponent’s strongest reply. Beginner mistakes often come from planning as though the other side will cooperate. A threat is something the opponent can actually carry out, not merely a scary-looking piece.","method":"After each candidate, imagine switching seats. Inspect their checks, captures and direct threats. If one wins your queen or mates you, repair the candidate or reject it. Also distinguish a real threat from one that fails tactically.","trap":"Do not defend against every imaginary threat; that gives away useful moves. Calculate whether the threat works before spending a move stopping it.","transfer":"Before clicking a move in your next game, name one strong reply for your opponent.","questions":[{"q":"You have a promising attack, but the opponent has mate in one. What takes priority?","options":["Stop the mate or deliver immediate mate yourself.","Continue the attack because initiative is always worth more.","Take the most valuable undefended piece."],"correct":0,"explain":"A future attack or material gain cannot compensate for being checkmated on the next move."},{"q":"How do you decide whether a threat is real?","options":["Calculate the threatened move and your replies.","Assume every queen move is dangerous.","Ignore it unless it is a check."],"correct":0,"explain":"A threat may be tactically unsound; conversely, a quiet move can create a genuine decisive threat."}]},{"id":"L10","stage":1,"title":"Loose pieces and undefended targets","theme":"hangingPiece","minutes":6,"idea":"An undefended piece has no friendly protector. A loose piece may be defended too few times or by an unsuitable defender. Loose pieces create tactics because a forcing move can distract the defender or attack two targets at once.","method":"Scan both armies for undefended pieces. Before taking one, count legal recaptures and check tactical replies. A defended target can still be won when its defender is pinned or overloaded; a seemingly free target can be poisoned.","trap":"Do not count an absolutely pinned defender as freely mobile. And do not take a “free” piece without checking for mate or a stronger capture elsewhere.","transfer":"At each pause in a slow game, identify your least-defended piece.","questions":[{"q":"An enemy bishop has no defender. Should you always take it?","options":["Only after checking the opponent’s forcing replies.","Yes; undefended pieces are always free.","No; it must be a trap."],"correct":0,"explain":"Lack of a defender is a clue, not a proof. Your capture may expose your king or abandon something more valuable."},{"q":"Why are two loose pieces tactically vulnerable?","options":["One move may attack both or distract their defenders.","They automatically cannot move.","Their material value becomes zero."],"correct":0,"explain":"Loose targets make forks, discovered attacks and deflections more effective."}]},{"id":"L11","stage":1,"title":"Count material without worshipping it","theme":"capture","minutes":6,"idea":"A useful rough scale is pawn 1, knight 3, bishop 3, rook 5 and queen 9. The king has no tradable value. These are starting estimates, not laws: activity, king safety, pawn structure and tactical threats can outweigh material.","method":"When considering a trade, count the whole sequence. If you trade a bishop for a rook, you gain roughly two points before considering the resulting position. Do not stop counting after your first capture; include the opponent’s recapture.","trap":"“I took a rook” is not a successful trade if you then lose your queen. Material bookkeeping must cover the entire forcing sequence.","transfer":"For the next three exchanges, calculate the net material change before moving.","questions":[{"q":"You give up a bishop and win a rook with no further loss. Roughly what is the gain?","options":["About two pawns of material.","About five pawns.","No gain because both are pieces."],"correct":0,"explain":"Using the rough values, 5 minus 3 is 2. The resulting position still matters."},{"q":"You can win a queen but allow immediate checkmate. Is that favorable?","options":["No; checkmate decides the game.","Yes; the queen is worth nine points.","It depends on how many pawns remain."],"correct":0,"explain":"Material values help compare positions only while the game has not been decided by mate."}]},{"id":"L12","stage":1,"title":"Safe captures and recapture order","theme":"capture","minutes":6,"idea":"A contested square is a calculation problem, not a vote count. The number of attackers and defenders matters, but their values, pins and move order matter too. A queen cannot profitably take a defended pawn simply because you have an extra attacker nearby.","method":"List the legal capture sequence and stop only when both sides can safely decline further exchanges. Recalculate if a capture opens a rook or bishop line. Ask whether a checking intermediate move changes whose piece is captured next.","trap":"“Three attackers versus two defenders” is not a guarantee. A king may be unable to recapture onto an attacked square, and a pinned piece may not be able to recapture at all.","transfer":"Before a contested capture, state the first three half-moves and the material remaining.","questions":[{"q":"Is attacker-versus-defender counting sufficient to judge every exchange?","options":["No; piece values, legality and move order also matter.","Yes; the side with more attackers always wins material.","Only pawn counts matter."],"correct":0,"explain":"The order and value of captures can turn a numerical advantage into a losing exchange."},{"q":"After capturing a defended piece, what should you inspect first?","options":["The opponent’s strongest legal reply, including checks.","Only the expected automatic recapture.","Your next attacking move."],"correct":0,"explain":"The opponent can insert a stronger move rather than immediately recapturing."}]},{"id":"L13","stage":1,"title":"The blunder check before you commit","theme":"safety","minutes":6,"idea":"A blunder check is a final inspection of your chosen move. It is not a second full analysis. Its purpose is to catch a queen left en prise, a mate threat ignored, or a defender accidentally removed.","method":"Visualize the destination position. Check your king, your queen, undefended pieces and newly opened lines. Inspect enemy checks and captures. Pay particular attention to the square you vacate: many mistakes happen behind the moving piece.","trap":"Do not perform the safety scan only when you feel unsure. Confident, “obvious” moves are exactly where the routine earns its value.","transfer":"Use a short pause on every non-forced move, especially recaptures.","questions":[{"q":"Where should your final blunder check be performed?","options":["In the imagined position after your move.","Only in the current position.","Only on the piece you intend to capture."],"correct":0,"explain":"Moving changes attacks, defenders and open lines. Inspect the resulting board."},{"q":"Which move deserves a blunder check?","options":["An apparently automatic recapture too.","Only sacrifices.","Only moves made while in check."],"correct":0,"explain":"Automatic moves can overlook intermediate checks, pins and changes in the position."}]},{"id":"L14","stage":1,"title":"Defend with purpose","theme":"defense","minutes":6,"idea":"A threat can be met by moving the target, adding a defender, capturing the attacker, blocking its line, or making a stronger forcing threat. Good defense aims to solve the problem without making your whole position passive.","method":"Name the exact threat, then generate at least two types of defense. Prefer a defense that also develops a piece, improves activity or creates a useful counterthreat, but only after proving it actually prevents the danger.","trap":"A counterattack is not automatically a defense. If the opponent can carry out mate with check, your threat against their rook may not matter.","transfer":"In one defensive position, compare “move away” with “improve and defend.”","questions":[{"q":"Your knight is attacked. Must it move?","options":["No; defending it, removing the attacker or a sound counterthreat may work.","Yes; attacked pieces must move.","No; always counterattack the queen."],"correct":0,"explain":"There are several defensive resources. The position determines which ones are sound."},{"q":"What makes a counterthreat a valid defense?","options":["Its concrete force prevents or outweighs the original threat.","It looks more aggressive.","It attacks a piece of any value."],"correct":0,"explain":"The opponent may ignore a weaker threat. Compare the actual sequences, particularly checks and mate."}]},{"id":"L15","stage":1,"title":"Use the clock as a resource","theme":"safety","minutes":6,"idea":"Your clock is part of the position. Spend more time when the position changes sharply: tactical contact, pawn breaks, sacrifices, transitions into endings and difficult defensive choices. Save time in familiar, low-risk positions without moving automatically.","method":"For learning, use a time control that lets you apply your thought routine. Mark where you spent too long or moved too quickly. A move made in five seconds and a move made after careful calculation can be equally wrong, but they need different training fixes.","trap":"Do not aim to finish every game with almost all your time left. Do not use most of your time chasing certainty in a quiet position either.","transfer":"After a game, identify one place where more thinking time would have been useful.","questions":[{"q":"Which position usually deserves a larger share of your remaining time?","options":["A critical transition with irreversible consequences.","A familiar forced recapture with no alternative.","Every move should take exactly the same time."],"correct":0,"explain":"Time should follow decision difficulty and consequences, not a fixed seconds-per-move formula."},{"q":"What does repeatedly losing with most of your clock unused suggest?","options":["You may not be using enough time to check your moves.","Your opening must be bad.","You need to play faster."],"correct":0,"explain":"Unused time is not proof of good thinking. Review whether a brief safety check would have prevented the losses."}]},{"id":"L16","stage":1,"title":"Your first complete thinking test","theme":"safety","minutes":6,"idea":"You now have a practical loop: observe, generate candidates, calculate replies, evaluate, blunder-check. The point is not to recite a slogan; it is to notice what you previously missed. Until safety is reliable, add complexity slowly.","method":"Play a slow practice game with one process goal: name the opponent’s threat before every move. Afterward, find your first avoidable material loss. Reconstruct your thought at that moment without engine help, then compare a safer decision.","trap":"A win does not mean your process was good, and a loss does not mean it was bad. An opponent can fail to punish a mistake. Track recurring decisions, not just results.","transfer":"Take the stage checkpoint, then play one game and record your first critical decision in the journal.","questions":[{"q":"You won despite leaving your queen undefended. What should you conclude?","options":["The result was good, but the decision still needs review.","The move was correct because you won.","Safety checks are unnecessary against weak players."],"correct":0,"explain":"A result does not validate every move. Improvement depends on recognizing errors even when unpunished."},{"q":"Which review target is most useful at this stage?","options":["The first avoidable material loss and the thought process behind it.","Every engine difference equally.","Only the final mating move."],"correct":0,"explain":"Early avoidable losses often explain the rest of the game more usefully than the final result."}]},{"id":"L17","stage":2,"title":"Forks: one move, two problems","theme":"fork","minutes":6,"idea":"A fork attacks two or more targets at once. Knights are famous for forks, but pawns, bishops, rooks, queens and kings can all create double attacks. A fork with check is forcing because the opponent must address the king before the other target.","method":"Look for valuable targets sharing a landing square for your piece. Verify the forking piece cannot simply be captured. Then calculate the strongest defense: moving one target with check or defending both may change the result.","trap":"Do not stop at “it attacks two pieces.” Both targets may be defended, the fork may lose its attacker, or the opponent may have a stronger move.","transfer":"Scan for king-and-queen or king-and-rook fork geometry in your next three puzzle positions.","questions":[{"q":"Why is a fork that includes the king often powerful?","options":["The opponent must answer check before saving the other target.","The forking piece becomes immune to capture.","The second target is automatically lost without calculation."],"correct":0,"explain":"Check narrows the replies, but legal captures of the attacker and other resources still need checking."},{"q":"What must you verify after spotting a knight fork?","options":["Whether the knight can be captured and how the opponent can reply.","Only whether the squares form an L.","Whether the knight began on its original square."],"correct":0,"explain":"Geometry identifies a candidate; calculation proves that the fork gains something."}]},{"id":"L18","stage":2,"title":"Pins: a defender with a restriction","theme":"pin","minutes":6,"idea":"A pin aligns an attacking slider, a front piece and a more important target behind it. An absolute pin is to the king: moving off the line may be illegal. A relative pin is to material such as a queen: moving is legal but may be expensive.","method":"Find the alignment and the pinning piece’s line. A pinned piece can sometimes move along that line or capture the pinning piece. Increase pressure on the pinned target, or exploit the square it can no longer legally defend.","trap":"A relative pin is not a legal restraint. A queen-pinned knight may move with check or deliver mate; calculate instead of assuming it is frozen.","transfer":"Whenever you see a pin, name the front piece, rear target and possible ways to break it.","questions":[{"q":"Which pin can make moving the front piece illegal?","options":["A pin to its king.","A pin to its queen.","A pin to an undefended rook."],"correct":0,"explain":"Leaving your king in check is illegal. Losing material behind a relatively pinned piece is legal."},{"q":"Can an absolutely pinned rook ever move?","options":["Yes, possibly along the pin line while still shielding its king.","No, pinned pieces can never move.","Yes, to any square if it gives check."],"correct":0,"explain":"The move is legal only if the king remains safe. Moving along the line or capturing the pinning piece can do that."}]},{"id":"L19","stage":2,"title":"Skewers and lines that open","theme":"skewer","minutes":6,"idea":"A skewer places a valuable front target in the line of a rook, bishop or queen, with a second target behind. When the front target moves, the rear target may be lost. It resembles a pin with the priorities reversed.","method":"Search for aligned king-and-queen or king-and-rook targets. A checking skewer forces a king response, but inspect whether the rear piece can be protected, the line blocked, or the attacker captured.","trap":"Do not confuse alignment with a working tactic. Another piece between the targets, a defended attacker, or an available interposition can change the outcome.","transfer":"Name two enemy pieces that share a file, rank or diagonal before calculating a skewer.","questions":[{"q":"What distinguishes a classic skewer from a classic pin?","options":["The more valuable target is in front and is induced to move.","Only knights can skewer.","A skewer never gives check."],"correct":0,"explain":"A skewer drives away the front target to expose the target behind it."},{"q":"You see king and queen aligned on a diagonal. What next?","options":["Check whether your bishop can reach the line safely and whether defenses exist.","Assume the queen is lost.","Move any bishop toward the king."],"correct":0,"explain":"You need a legal, tactically sound way to exploit the alignment."}]},{"id":"L20","stage":2,"title":"Discovered attacks and double check","theme":"discoveredAttack","minutes":6,"idea":"A discovered attack occurs when moving one piece uncovers the attack of another. The moving piece may create a second threat at the same time. In a discovered check, the uncovered attack is against the king. Double check means both pieces give check.","method":"Find a friendly slider pointing through a friendly blocker toward an enemy target. Ask where the blocker can move with a useful threat. In double check, inspect king escapes first because non-king replies cannot solve both attacks.","trap":"The blocker does not have unlimited freedom: it cannot leave your own king exposed. Also verify that the uncovered ray truly reaches the target after moving.","transfer":"When developing a piece, notice which line it uncovers behind it.","questions":[{"q":"What is the moving piece doing in a discovered attack?","options":["Uncovering the line of another friendly piece.","Always capturing the enemy king.","Only moving backward."],"correct":0,"explain":"The defining feature is the opened line, not the direction of the moving piece."},{"q":"Why can double check create a forcing combination?","options":["It restricts the defender to king moves.","It automatically wins the queen.","It permits you to leave your own king in check."],"correct":0,"explain":"Restricted replies make calculation easier, but the attacker still needs a concrete continuation."}]},{"id":"L21","stage":2,"title":"Remove or distract the defender","theme":"deflection","minutes":6,"idea":"Many targets are safe only because one piece protects them. You can capture that defender, draw it away, block its line or force it to perform another duty. Deflection pulls a piece away from an important square or task.","method":"Start from the target you would like to win. Ask what prevents it, then identify the defender. Calculate whether a forcing move can remove that obstacle. The first sacrifice is justified only by what happens after the best reply.","trap":"Do not assume the opponent must accept a sacrifice. A refusal, intermediate check or different recapture may preserve the defense.","transfer":"For one tactical position, explain the defender’s job before looking for the winning move.","questions":[{"q":"What is the right starting question for a deflection tactic?","options":["Which defender is preventing my desired follow-up?","Which piece can I sacrifice most dramatically?","How can I give any check?"],"correct":0,"explain":"The tactic is driven by a defensive duty, not by sacrifice for its own sake."},{"q":"Your combination works if a sacrifice is accepted. Is that enough?","options":["No; inspect sensible ways to decline it.","Yes; accepting is compulsory.","Yes, if the sacrifice is a queen."],"correct":0,"explain":"The opponent chooses the strongest legal reply, not the one your intended line requires."}]},{"id":"L22","stage":2,"title":"Between moves: do not recapture on autopilot","theme":"intermezzo","minutes":6,"idea":"An intermediate move interrupts an expected sequence. Instead of recapturing immediately, a player gives check, attacks a queen or creates a stronger threat first. The original recapture may still be available after the opponent responds.","method":"At every capture in a combination, pause and inspect checks and forcing threats for the side to move. Compare immediate recapture with an intermediate move. Be especially alert when one king is exposed or a queen is loose.","trap":"A surprising move is not automatically strong. It must preserve or improve the final result against the opponent’s best reply.","transfer":"In your next exchange calculation, deliberately ask “Is there a zwischenzug?” for both sides.","questions":[{"q":"What is an intermediate move?","options":["A useful forcing move inserted before an expected recapture or continuation.","Any move made in the middlegame.","An illegal move played between turns."],"correct":0,"explain":"The term describes move order: first force another response, then return to the original business."},{"q":"Who can use an intermediate move in your calculated line?","options":["Either side.","Only the side that started the combination.","Only the player whose queen is attacked."],"correct":0,"explain":"You must test the defender’s intermediate resources as carefully as your own."}]},{"id":"L23","stage":2,"title":"Mating nets: take away the exits","theme":"mateIn2","minutes":6,"idea":"A mating attack combines a checking piece with control of escape squares. Supporting pieces and pawns often do the quiet work. Common patterns include the back-rank mate, a protected queen beside the king, and a knight mating a king boxed in by its own pieces.","method":"Count the king’s exits before choosing a check. Identify the attacker, its protection, and the pieces covering flight squares. For mate in two, your first move must guarantee a mating move against every legal reply.","trap":"A line that mates against one convenient defense is not a forced mate. You must also test captures, blocks and unexpected king moves.","transfer":"For each solved mate puzzle, explain which piece covers each escape square.","questions":[{"q":"What does “mate in two” require?","options":["A first move after which every legal defense allows mate on your next move.","One possible two-move mating line.","Giving check twice, whether or not the king escapes."],"correct":0,"explain":"Forced mate is a statement about all legal defenses, not just the displayed main line."},{"q":"Why can a quiet move be stronger than a check in a mating attack?","options":["It may close escape squares and create an unavoidable threat.","Checks are always bad.","Quiet moves let you ignore the opponent’s threat."],"correct":0,"explain":"Restricting the king can matter more than checking immediately. Concrete defensive resources still determine the answer."}]},{"id":"L24","stage":2,"title":"Calculate the whole combination","theme":"calculation","minutes":6,"idea":"A combination is a sequence, not a move-shaped answer. The first sacrifice may only make sense after a defender is removed, a line opens and a final fork appears. Solving only the first move trains recognition without verifying the idea.","method":"Write or visualize your candidate line to a stable result: mate, a clear material gain or a position you can evaluate. Include the strongest defense at each branch. On the board, the app plays the opponent’s reference replies; you must supply every move for your side.","trap":"Do not assume a puzzle tactic will exist in every real position. Sometimes the best decision is to improve a piece and keep the tension.","transfer":"Solve a puzzle without moving pieces first; afterward compare your predicted replies with the actual line.","questions":[{"q":"Where should a calculation ideally stop?","options":["At a stable position that you can evaluate.","Immediately after your first attractive sacrifice.","After exactly three half-moves in every position."],"correct":0,"explain":"Stopping in the middle of a forcing exchange produces misleading evaluations."},{"q":"In a normal game, must there always be a tactical win?","options":["No; a sound improving move may be best.","Yes; every position is a puzzle.","Yes, whenever your opponent moves a pawn."],"correct":0,"explain":"Puzzle positions are selected for tactics. Real games contain many positions with no forced win."}]},{"id":"L25","stage":3,"title":"The opening’s three jobs","theme":"opening","minutes":8,"idea":"The opening should give you active pieces, a share of the center and a safe king. These goals interact: central pawns create development routes, developed pieces support central play, and a safe king lets the rooks participate.","method":"For each move, explain which job it serves. Develop minor pieces to useful squares, contest central influence, and consider castling before the center opens. Principles generate candidates; tactics can require exceptions.","trap":"Do not treat “never move a piece twice” as a rule. You may need to retreat an attacked piece or exploit a concrete opportunity. The problem is unnecessary loss of time, not repetition itself.","transfer":"For your first ten moves, annotate the purpose of each move in one phrase.","questions":[{"q":"Which set best describes the opening’s main aims?","options":["Development, central influence and king safety.","Queen activity, pawn grabbing and immediate sacrifice.","Memorizing moves without knowing the resulting position."],"correct":0,"explain":"These three aims create a position where your pieces can work together."},{"q":"Should an opening principle override a concrete tactic?","options":["No; verify the concrete position.","Always; principles have no exceptions.","Only when playing White."],"correct":0,"explain":"Principles are guides to promising moves, not substitutes for tactical calculation."}]},{"id":"L26","stage":3,"title":"Center control and pawn breaks","theme":"opening","minutes":8,"idea":"You can influence the center with pawns, pieces or pressure against the opponent’s central pawns. Occupying a central square is useful only if you can support it. A pawn break challenges the structure and changes which lines are open.","method":"Before a central push, ask what happens after captures, whether your pieces are ready, and whose king benefits from opening lines. Compare maintaining the tension with resolving it.","trap":"Do not exchange central pawns automatically just because a capture is legal. Releasing tension can free the opponent’s pieces or give up a useful space advantage.","transfer":"Identify the main central pawn break in the opening you choose to practice.","questions":[{"q":"When is opening the center especially attractive?","options":["When your development and king safety make the open lines favorable.","Whenever a pawn capture is available.","Only after both queens are traded."],"correct":0,"explain":"Open lines reward active pieces and can punish an unsafe king. Readiness matters."},{"q":"Must you occupy every central square with a pawn to control it?","options":["No; pieces and pressure can also control the center.","Yes; only pawns count.","No; the center never matters."],"correct":0,"explain":"Central influence can be direct or indirect. Both occupation and pressure can be useful."}]},{"id":"L27","stage":3,"title":"Development is usable activity","theme":"opening","minutes":8,"idea":"A piece is not well developed merely because it left its starting square. It needs useful influence and coordination. A knight placed where it can be chased repeatedly may lose time; a bishop outside its pawn chain may gain lasting activity.","method":"Find your least useful undeveloped minor piece and a safe square that helps your plan. Avoid blocking another piece’s only good route. After developing, connect the rooks and consider where they belong.","trap":"Bringing the queen out early often lets the opponent develop while attacking it. But “queen moved early” alone is not proof of a mistake; check whether it actually loses time or becomes vulnerable.","transfer":"Before a second move by the same piece, ask whether another piece needs activation more.","questions":[{"q":"What is the best definition of effective development?","options":["Placing pieces where they contribute safely to the position.","Moving every piece exactly once.","Moving all pawns before any pieces."],"correct":0,"explain":"Usefulness and coordination matter more than simply leaving the back rank."},{"q":"Why can early queen moves be risky?","options":["The opponent may gain developing moves by attacking the queen.","Queens are not allowed to move before move ten.","A queen away from its home square loses value."],"correct":0,"explain":"The practical issue is lost time and vulnerability, not a special restriction on the queen."}]},{"id":"L28","stage":3,"title":"The Italian: a plan with 1.e4","theme":"opening","minutes":8,"idea":"After 1.e4 e5 2.Nf3 Nc6 3.Bc4, White develops toward the center and points the bishop at f7. A calm plan can include d3, castling, c3 and later d4 when prepared. Black also develops and contests the center; White is not entitled to an attack.","method":"Use Opening Lab to rehearse a short line, then explain each move. Nf3 attacks e5 and helps castling; Bc4 creates activity; c3 can support d4. Watch the e4 pawn and the consequences of opening the center.","trap":"Do not confuse pressure on f7 with a forced win. Premature attacks involving the queen can hand Black useful developing moves.","transfer":"Play the short Italian line once from memory, then once while stating the purpose of every move.","questions":[{"q":"What does 2.Nf3 accomplish after 1.e4 e5?","options":["Develops a knight, attacks e5 and helps prepare castling.","Guarantees a win of the e5 pawn.","Prevents Black from developing the queenside."],"correct":0,"explain":"The move serves several opening aims, but Black has sound ways to defend the pawn."},{"q":"What can c3 prepare in a quiet Italian structure?","options":["A supported d4 pawn break.","Immediate castling queenside regardless of the pieces.","A guaranteed mating attack on f7."],"correct":0,"explain":"c3 supports d4, but timing still depends on development and tactics."}]},{"id":"L29","stage":3,"title":"A dependable reply to 1.e4","theme":"opening","minutes":8,"idea":"A small repertoire is easier to understand than a collection of unrelated traps. Classical ...e5 contests the center immediately. The Caro–Kann begins 1.e4 c6 with the idea ...d5; the French begins ...e6 and ...d5 but initially restricts the c8 bishop.","method":"Choose one defense as your main practice system. Learn the central structure, where the minor pieces go and the typical pawn breaks. When the opponent deviates, return to those plans and check tactics rather than trying to force the memorized line.","trap":"Do not switch openings after every loss without checking the cause. A hanging piece on move 18 is not necessarily an opening problem.","transfer":"Pick one Black defense in Opening Lab and describe its main central plan.","questions":[{"q":"What is the central idea of 1...c6 in the Caro–Kann?","options":["Prepare ...d5 to challenge White’s center.","Attack the white queen immediately.","Avoid ever moving a central pawn."],"correct":0,"explain":"The c-pawn supports the d-pawn advance. The resulting structures depend on White’s response."},{"q":"Your opponent plays an unfamiliar move. What should you do?","options":["Check threats, development and the central structure.","Play the next memorized move regardless.","Assume the unfamiliar move is losing."],"correct":0,"explain":"A repertoire is a map, not a forced script. The actual position takes priority."}]},{"id":"L30","stage":3,"title":"Understand 1.d4 structures","theme":"opening","minutes":8,"idea":"After 1.d4, the d-pawn is protected by the queen. In a Queen’s Gambit structure, c4 challenges Black’s d5 pawn. Black can support the center with ...e6 or choose other sound setups. The resulting pawn structure shapes the middlegame.","method":"Look for the central exchanges: cxd5, ...dxc4, ...c5 and ...e5. Decide which changes help your pieces. Notice whether a bishop has been locked behind its own pawns or developed before the pawn chain closes.","trap":"Do not treat every opening beginning with d4 as the same setup. A Queen’s Gambit structure and a London structure place different demands on the pieces.","transfer":"Replay a Queen’s Gambit line and name the purpose of c4 and ...e6.","questions":[{"q":"What is White challenging with c4 after d4 and ...d5?","options":["Black’s central d5 pawn.","Only Black’s h7 pawn.","The legality of Black’s next move."],"correct":0,"explain":"The c-pawn challenges the center from the side and can help produce favorable central exchanges."},{"q":"Why should you learn the pawn structure of your opening?","options":["It suggests piece placements, targets and pawn breaks.","It lets you ignore the opponent’s pieces.","Pawn structures can never change."],"correct":0,"explain":"Structures guide plans, but you must update the plan when exchanges or breaks change them."}]},{"id":"L31","stage":3,"title":"Meet traps without becoming a trap player","theme":"opening","minutes":8,"idea":"An opening trap exploits a concrete error. Learning a trap is useful when it teaches a recurring weakness or defensive resource. It is harmful when you rely on the opponent making the one move that loses.","method":"When an early queen or bishop targets your king, identify the exact mating square and the number of attackers. Choose a developing defense that meets the threat. After meeting it, continue ordinary development rather than chasing the queen aimlessly.","trap":"Do not assume a flashy early attack is either brilliant or bad. Calculate the threat. A careless pawn move can weaken the king even if it gains a tempo against the queen.","transfer":"For every trap you study, learn the opponent’s sound defense as well as the losing continuation.","questions":[{"q":"What is the useful lesson to take from an opening trap?","options":["The tactical mechanism and the sound defense.","That the opponent must fall into it.","A forced win against every response."],"correct":0,"explain":"A trap is conditional. Knowing the defense prevents you from confusing a trick with a sound repertoire."},{"q":"How should you answer an early mate threat?","options":["Meet the concrete threat, preferably while developing.","Ignore it because early queen moves are bad.","Chase the queen with any pawn move."],"correct":0,"explain":"General principles do not cancel a real mate threat. Solve the tactical problem first."}]},{"id":"L32","stage":3,"title":"Build a repertoire you can explain","theme":"opening","minutes":8,"idea":"A useful first repertoire covers one White approach and Black’s main answers to e4 and d4. Learn short branches, common deviations, typical tactics and the middlegame plans they produce. Depth can grow when your games reveal a genuine need.","method":"Use a cycle: play, identify the first unfamiliar position, analyze it, add one meaningful branch, review later. Rehearse from both sides when helpful. The goal is recognition and understanding, not reproducing moves under all circumstances.","trap":"Do not count memorized moves as chess strength. If you cannot explain the pawn break or your worst piece after the line ends, add understanding before more depth.","transfer":"Save one opening line and write one sentence describing the resulting middlegame plan.","questions":[{"q":"When should you add more opening detail?","options":["When your games expose a recurring gap you need to understand.","Whenever you lose any game for any reason.","Before learning basic tactics."],"correct":0,"explain":"A game-driven repertoire expands in the places that actually affect your decisions."},{"q":"What should you know when your memorized line ends?","options":["The structure, piece roles and likely plans.","Only the opening’s name.","That your position must be winning."],"correct":0,"explain":"The opening should lead into a middlegame you can navigate, not leave you without a plan."}]},{"id":"L33","stage":4,"title":"Activate your king safely","theme":"endgame","minutes":8,"idea":"As attacking material disappears, the king often becomes an active fighting piece. It can attack pawns, support passed pawns and block the enemy king. Activity is still conditional: remaining rooks or queens can make a exposed king vulnerable.","method":"Compare the kings’ routes to important squares. Move toward useful targets, not simply toward the geometric center. Check pawn races and forcing checks before committing to a long king walk.","trap":"“Centralize the king” is not a command to walk into checks. In some endings, cutting off the enemy king matters more than advancing your own immediately.","transfer":"In your next ending, identify the square your king most needs to reach.","questions":[{"q":"Why does the king often become more active in an ending?","options":["With fewer attacking pieces, it can safely support pawns and attack targets.","It gains the movement of a queen.","Check no longer matters."],"correct":0,"explain":"The king’s movement rules do not change; the danger and strategic role do."},{"q":"Where should an endgame king head?","options":["Toward a useful target or key square, subject to safety and timing.","Always to e4 regardless of the position.","Always away from all pawns."],"correct":0,"explain":"Activity is about the concrete task, not a universal destination."}]},{"id":"L34","stage":4,"title":"Mate with king and queen","theme":"mateIn1","minutes":8,"idea":"A queen and king can force mate against a lone king. First restrict the enemy king to a smaller area, then bring your king to support the final mating net. Keep your queen safe from the king and avoid removing all legal moves without giving check.","method":"Use the queen to make a box. Shrink it when safe, bring the king closer and finish at the edge. In the final position, make sure the queen is protected and every escape is controlled. Practice against the engine from several starting positions.","trap":"Moving the queen too close can either lose it or produce stalemate. Do not keep shrinking the box when the defender has no safe move left.","transfer":"Complete a queen-mate drill without taking back a move, then repeat from the opposite color.","questions":[{"q":"What is the queen’s main job before the final mate?","options":["Restrict the enemy king while remaining safe.","Give check on every move.","Capture the king directly."],"correct":0,"explain":"Cutting off space makes the mate methodical. Repeated checks alone may let the king escape."},{"q":"What is the main practical danger when your queen dominates a lone king?","options":["Stalemate or leaving the queen capturable.","The opponent promoting a king.","An automatic draw after one queen move."],"correct":0,"explain":"A large material advantage still needs careful legal-move counting."}]},{"id":"L35","stage":4,"title":"Mate with king and rook","theme":"mateIn1","minutes":8,"idea":"A rook and king can also force mate against a lone king. The rook cuts off ranks or files, and your king helps drive the enemy king to the edge. Unlike a queen, the rook usually needs more direct king support to shrink the box.","method":"Cut off space, improve your king and use a checking rook move when the king support makes the restriction effective. Keep the rook far enough away that the enemy king cannot attack it with tempo. Waiting moves may be needed to arrange the kings.","trap":"Do not chase with checks while your king stays far away. The enemy king can keep returning to the center. Do not place the rook next to it unprotected.","transfer":"Practice rook mate from the lab. Explain whether each move restricts, supports or waits.","questions":[{"q":"Why is your king important in a rook-mate ending?","options":["It controls escape squares and helps drive the enemy king back.","It can move twice when the rook checks.","It replaces the need for a rook."],"correct":0,"explain":"The rook alone can cut off space, but the king’s support creates the final mating net."},{"q":"Which plan is more reliable than random repeated checks?","options":["Restrict the king, bring your own king, then force it to the edge.","Leave your king on its starting square indefinitely.","Put an unprotected rook next to the enemy king."],"correct":0,"explain":"Coordination and restriction make progress; uncoordinated checks can waste moves."}]},{"id":"L36","stage":4,"title":"Opposition is about entry squares","theme":"pawnEndgame","minutes":8,"idea":"With kings facing each other and one square between them, the player not to move has direct opposition. The other king may be forced to yield an entry square. Opposition is a tool for gaining or denying access, not a point-scoring game.","method":"Identify the squares you need to enter. Compare whose move it is and whether a spare pawn move can transfer the move to the opponent. Remember that diagonal and distant opposition can sometimes lead to the same useful relationship.","trap":"Do not grab opposition if it abandons a pawn or misses a faster win. The value of opposition comes from the entry squares it controls.","transfer":"Set up a king-and-pawn drill and explain which squares the defender is trying to deny.","questions":[{"q":"Two kings face each other with one square between them. Who has direct opposition?","options":["The side not to move.","The side to move.","Always White."],"correct":0,"explain":"The moving king may have to yield. Whether that matters depends on the surrounding pawn position."},{"q":"What is the purpose of taking opposition?","options":["Gain or deny access to important squares.","Accumulate an automatic material bonus.","Force a draw in every pawn ending."],"correct":0,"explain":"Opposition only matters through the access and timing it creates."}]},{"id":"L37","stage":4,"title":"Key squares and the square of the pawn","theme":"pawnEndgame","minutes":8,"idea":"Key squares are squares your king can occupy to secure a pawn’s promotion with correct play in a particular king-and-pawn ending. Their locations depend on the pawn’s rank and whether it is a rook pawn. The square-of-the-pawn rule is a quick guide to an unassisted pawn race.","method":"For a pawn race, count the pawn’s moves to promotion and the king’s route, including whose move it is and a possible initial double move. For a blocked pawn, focus on king entry and key squares rather than pushing automatically.","trap":"Do not apply the square rule without checking blockers, captures, checks and support from other pieces. Rook pawns have important drawing exceptions when the defending king reaches the corner.","transfer":"Compare a pawn push with a king move in one basic pawn ending before deciding.","questions":[{"q":"What can the square-of-the-pawn rule help estimate?","options":["Whether a king can catch a freely advancing pawn.","Whether a bishop is good or bad.","The exact evaluation of every rook ending."],"correct":0,"explain":"It is a pawn-race shortcut. Real obstacles, move order and other pieces still require calculation."},{"q":"Why can a king move be better than pushing a passed pawn immediately?","options":["The king may need to secure entry or promotion squares first.","Passed pawns may never advance without checking.","A king move always wins any pawn ending."],"correct":0,"explain":"King support and timing can be necessary. A premature push may let the defender block the pawn."}]},{"id":"L38","stage":4,"title":"Create a passer; count the race","theme":"promotion","minutes":8,"idea":"A passed pawn has no enemy pawn ahead of it on its own or adjacent files. A protected passer has friendly pawn support. An outside passer can draw the enemy king away, allowing your king to attack the other wing.","method":"Calculate the race from the promotion square backward. Include checking promotions, captures on the way and whether a newly promoted queen can stop the other pawn. In pawn breakthroughs, examine the order of pawn sacrifices, not just the final open file.","trap":"Do not assume that promoting first wins. A promotion with check can change the tempo; both sides may promote, and stalemate or perpetual check may still matter.","transfer":"In a pawn race, count both promotion moves and the first move after promotion.","questions":[{"q":"What makes a pawn passed?","options":["No enemy pawn ahead on its file or adjacent files can stop it by pawn contact.","It has crossed the center, regardless of enemy pawns.","It is defended by a rook."],"correct":0,"explain":"The definition concerns opposing pawns ahead on the same and neighboring files."},{"q":"Why can an outside passed pawn be valuable even if it is captured?","options":["It may divert the enemy king while your king wins elsewhere.","Capturing a passed pawn is illegal.","It automatically becomes a queen when captured."],"correct":0,"explain":"A decoy passer can create a favorable king race on the other side of the board."}]},{"id":"L39","stage":4,"title":"Rooks need activity","theme":"rookEndgame","minutes":8,"idea":"In rook endings, an active rook can compensate for weaknesses by attacking pawns, checking the king and cutting off entry. A passive rook tied to one pawn may leave the king and other pawns vulnerable. “Rooks behind passed pawns” is a useful guideline, not a universal rule.","method":"Look for active checks, attacks from the side or rear, and opportunities to cut off the enemy king. Compare defending passively with creating counterplay. When placing a rook behind a passer, inspect whether the king can shelter from checks or force the rook away.","trap":"Do not memorize a slogan without checking the exact geometry. Rook placement, king shelter and pawn rank can make a different square preferable.","transfer":"In a rook ending, list your rook’s active options before deciding to defend a pawn.","questions":[{"q":"Why can an active rook be preferable to a passive defender?","options":["It can create threats and checks that restrict the opponent’s progress.","Rooks gain material value when giving check.","Defending pawns is always wrong."],"correct":0,"explain":"Activity gives practical and tactical resources. Whether it outweighs a pawn depends on the position."},{"q":"Is “rooks belong behind passed pawns” an exceptionless rule?","options":["No; use it as a guide and verify the concrete position.","Yes, regardless of checks or king safety.","It applies only before move ten."],"correct":0,"explain":"The principle is useful, but rook-ending geometry and timing can override it."}]},{"id":"L40","stage":4,"title":"Convert without giving counterplay","theme":"endgame","minutes":8,"idea":"Converting an advantage means improving the result while controlling the opponent’s resources. When ahead in material, favorable piece trades can simplify the task, but trading pawns indiscriminately can remove your winning chances. Keep your pieces active and your king safe.","method":"Identify the opponent’s only useful counterplay: checks, a passed pawn, a tactical threat or a fortress. Reduce that resource while improving your least active piece. Trade only after evaluating the resulting ending.","trap":"“Trade everything when ahead” is too crude. A final pawn trade can leave insufficient material; a rook trade can enter a drawn pawn ending.","transfer":"Before accepting an endgame trade, describe the resulting position and your winning plan.","questions":[{"q":"When ahead, should you trade every available piece and pawn?","options":["No; evaluate what the resulting ending allows.","Yes; every trade increases your advantage.","Only queens may be traded."],"correct":0,"explain":"Some trades simplify a win; others remove winning material or enter a theoretical draw."},{"q":"What should you identify before trying to convert an advantage?","options":["The opponent’s main source of counterplay.","Only the fastest-looking attack.","A way to keep every piece on the board."],"correct":0,"explain":"Suppressing their useful resources makes improvement safer and more effective."}]},{"id":"L41","stage":5,"title":"Evaluate before you choose a plan","theme":"strategy","minutes":8,"idea":"A positional evaluation asks who benefits from the enduring features of the board. Compare material, king safety, activity, pawn structure, space and immediate threats. A tactical emergency takes priority; without one, the imbalance can suggest a plan.","method":"Describe the position in one sentence: “I have the bishop pair and an open center, but my king is exposed.” Then choose a move that improves the favorable features or repairs the urgent weakness. Re-evaluate after major exchanges and pawn breaks.","trap":"Do not collect a list of features without ranking them. One mating threat matters more than several small positional advantages.","transfer":"At the first quiet middlegame position, write a one-sentence evaluation and a matching plan.","questions":[{"q":"What should a useful evaluation lead to?","options":["A concrete plan that fits the most important features.","A list of slogans unrelated to the next move.","A guaranteed numerical score without calculation."],"correct":0,"explain":"Evaluation is useful because it directs candidate moves and decisions."},{"q":"Which feature has priority when the opponent threatens immediate mate?","options":["The immediate tactical danger.","A distant queenside pawn majority.","The abstract value of the bishop pair."],"correct":0,"explain":"Urgent forcing threats override long-term considerations until they are resolved."}]},{"id":"L42","stage":5,"title":"Improve your worst piece","theme":"strategy","minutes":8,"idea":"When there is no forcing tactic and no urgent threat, improving your least effective piece is a practical way to find a move. A passive knight may need a route to an outpost; a bishop may need a pawn break; a rook may need an open file.","method":"Identify the piece with the fewest useful tasks. Name an ideal square and a realistic route, then ask whether the opponent can disrupt it. Sometimes the improvement requires exchanging a restrictive pawn or rerouting through a backward square.","trap":"Do not spend three tempi on a beautiful maneuver while the opponent opens your king. Slow improvements need a position that gives you time.","transfer":"In a quiet position, name your worst piece and its desired destination.","questions":[{"q":"What is a practical candidate generator in a quiet position?","options":["Improve the least effective piece.","Give any available check.","Push a random flank pawn."],"correct":0,"explain":"This method connects the next move to a real deficiency in the position."},{"q":"When can a slow maneuver be inappropriate?","options":["When the opponent has urgent threats or can open the position first.","Whenever it involves a retreat.","Whenever it uses more than one move."],"correct":0,"explain":"A maneuver must fit the available time. Retreats and multi-move routes can be excellent when the position permits them."}]},{"id":"L43","stage":5,"title":"Pawn chains, holes and outposts","theme":"strategy","minutes":8,"idea":"Pawn moves define lasting strengths and weaknesses because pawns cannot retreat. A hole is a square that nearby pawns can no longer defend. An outpost is a useful advanced square, often protected by your pawn and hard for enemy pawns to challenge.","method":"Inspect the bases of pawn chains and the squares they leave behind. Ask whether a knight can occupy a stable square and whether it would have meaningful targets there. A secure knight with no influence may be less useful than an active one elsewhere.","trap":"Do not label every advanced knight square an outpost. Enemy pawn breaks, exchanges and tactical attacks can make it temporary.","transfer":"Before a pawn push, name the square it permanently stops controlling.","questions":[{"q":"What makes an outpost especially useful?","options":["Stable occupation plus influence on important targets or squares.","Simply being on the opponent’s half of the board.","Being attacked by an enemy pawn."],"correct":0,"explain":"Security matters, but the piece also needs a useful job from that square."},{"q":"Why should you think carefully before moving a pawn?","options":["It cannot return, so it changes the structure and defended squares permanently.","Pawns cannot capture afterward.","Every pawn move is a weakening mistake."],"correct":0,"explain":"Pawn moves can be strong, but their irreversible effects deserve attention."}]},{"id":"L44","stage":5,"title":"Good bishops, bad bishops and knights","theme":"strategy","minutes":8,"idea":"A bishop restricted by its own fixed pawns is often called bad, especially when those pawns sit on its square color. It can still defend crucial weaknesses. Knights can work well in closed positions with stable outposts; bishops often benefit from open lines and play on both wings.","method":"Compare actual scope, targets and entry squares. Ask what exchanges or pawn breaks would improve your minor piece relative to its counterpart. Before trading, examine which piece will be better in the resulting structure.","trap":"Do not exchange a “bad bishop” automatically if it is your only defender of a vital color complex. Labels are a starting point for comparison, not the verdict.","transfer":"Before a minor-piece exchange, explain which remaining piece benefits from the pawn structure.","questions":[{"q":"Is a bishop restricted by its own pawns always useless?","options":["No; it may defend important squares and pawns.","Yes; exchange it at any cost.","Yes; it cannot legally capture."],"correct":0,"explain":"A bad bishop can have an essential defensive role even if its activity is limited."},{"q":"What kind of position can especially suit a knight?","options":["A closed structure with a stable, useful outpost.","Any position simply because knights are tricky.","A completely open board with no targets."],"correct":0,"explain":"Knights can jump blocked lines and exploit stable squares; concrete activity still matters."}]},{"id":"L45","stage":5,"title":"Open files and invasion squares","theme":"strategy","minutes":8,"idea":"An open file contains no pawns. A half-open file contains no pawn of one side. Rooks often use these files to become active, but control has value only if it leads to useful pressure or an entry square.","method":"Before doubling rooks, identify the invasion square and how it is defended. Prepare control of that square, compare exchanging the defending rook with preserving tension, and check whether your back rank is safe.","trap":"Do not contest an open file mechanically when there is no entry and a more urgent weakness elsewhere. Occupation without a follow-up can waste time.","transfer":"For one open file, name the exact square on which your rook hopes to enter.","questions":[{"q":"What makes control of an open file particularly useful?","options":["Access to an important entry square or target.","The file has an attractive letter.","It automatically wins a pawn."],"correct":0,"explain":"File control needs a concrete function, such as invasion or pressure."},{"q":"Before doubling rooks, what should you check?","options":["The entry square, opposing resources and your own king safety.","Only whether two rooks fit on the file.","Whether your queen has moved yet."],"correct":0,"explain":"Coordination helps only if the plan is tactically safe and strategically meaningful."}]},{"id":"L46","stage":5,"title":"Pawn breaks: change the position on purpose","theme":"strategy","minutes":8,"idea":"A pawn break makes contact with the enemy pawn structure and offers to change it. Typical breaks can free a bad bishop, challenge a space advantage or open a file for a rook. A prepared break may be stronger than a direct attack on a protected weakness.","method":"Calculate the main captures and refusals. Compare the structure afterward, the pieces activated, and the king whose shelter is reduced. Prepare with development and rook placement when immediate action is not required.","trap":"Do not assume a thematic break is correct at every moment. A tactically premature ...d5 or d4 can simply lose a pawn.","transfer":"Name your desired pawn break, then identify the one preparation it most needs.","questions":[{"q":"What should you calculate before a pawn break?","options":["The main captures, refusals and resulting piece activity.","Only the pawn’s destination.","Only whether the move appears in an opening book."],"correct":0,"explain":"The break’s value lies in the transformation it causes, not just the push itself."},{"q":"Can a typical break be bad in a particular position?","options":["Yes; timing and tactics can make it premature.","No; a thematic move is always best.","Only if it is played by Black."],"correct":0,"explain":"A strategic idea must still pass the concrete calculation test."}]},{"id":"L47","stage":5,"title":"Prophylaxis: improve while limiting their plan","theme":"defense","minutes":8,"idea":"Prophylaxis means anticipating and reducing the opponent’s useful plans. It can be active: improving a piece while controlling an entry square, preventing a pawn break while preparing your own, or giving the king an escape square before occupying an open file.","method":"Ask what you would play for the opponent if given the move. Identify their best plan, not every imaginable plan. Compare preventing it with allowing it under favorable circumstances.","trap":"Do not turn prophylaxis into fear. Spending moves preventing harmless plans can leave your own pieces passive and hand the opponent the initiative.","transfer":"In a quiet position, write the opponent’s most useful next move before choosing yours.","questions":[{"q":"What is a useful prophylactic question?","options":["What would I want to do if I were playing the other side?","How can I stop every legal move?","How can I avoid all pawn moves forever?"],"correct":0,"explain":"The goal is to understand and limit their useful resources, not to freeze the entire board."},{"q":"Must you prevent every opponent plan?","options":["No; compare its actual danger with your own opportunities.","Yes, even harmless plans.","No; defense is never worthwhile."],"correct":0,"explain":"Good prophylaxis is selective and proportionate. Sometimes allowing a plan is the best response."}]},{"id":"L48","stage":5,"title":"Attack where the position supports it","theme":"strategy","minutes":8,"idea":"An attack needs pieces, targets and time. A weakened king can be a target, but your pieces must reach it before the defender consolidates or counterattacks. With opposite-side castling, pawn storms may open attacking lines without exposing your own king on the same wing.","method":"Count attackers that can participate, identify entry squares and plan how to open lines. Include the defender’s counterplay in your calculation. When the center can open, king safety there may matter more than a slow flank attack.","trap":"Do not launch a pawn storm simply because you are bored. Pawn moves can create weaknesses without producing useful attacking lines.","transfer":"Before starting an attack, name the target, the participating pieces and the line you want to open.","questions":[{"q":"What does an effective attack need?","options":["A target, enough participating pieces and time to act.","Only a queen near the enemy king.","A pawn move on every turn."],"correct":0,"explain":"Attacking strength comes from coordinated resources and concrete access to the target."},{"q":"What must you include when calculating a flank attack?","options":["The opponent’s central or opposite-wing counterplay.","Only moves near the king you are attacking.","No defensive moves because you have the initiative."],"correct":0,"explain":"A successful attack must survive what the opponent can do elsewhere."}]},{"id":"L49","stage":6,"title":"Candidate moves before calculation","theme":"calculation","minutes":8,"idea":"Calculation becomes more efficient when you choose a small set of plausible candidates instead of analyzing the first move that catches your eye. Forcing moves deserve attention, but quiet improvements, defensive moves and pawn breaks belong in the list when the position calls for them.","method":"Start with threats and checks, captures and direct threats for both sides. Add one positionally motivated candidate. Compare two or three serious options. A new tactical discovery may require returning to a move you initially dismissed.","trap":"Do not confuse disciplined calculation with never revisiting a move. Revisit when new information changes the evaluation, not because you have forgotten what you already found.","transfer":"Before a critical move, name at least two candidate moves and why each deserves analysis.","questions":[{"q":"Why generate candidates before calculating deeply?","options":["It reduces tunnel vision and gives you alternatives to compare.","It guarantees the first candidate is best.","It eliminates the need to inspect threats."],"correct":0,"explain":"A candidate list helps you avoid overlooking a stronger move outside your first idea."},{"q":"Should quiet moves appear in a candidate list?","options":["Yes, when they meet the position’s needs.","Never; only checks can be best.","Only in king-and-pawn endings."],"correct":0,"explain":"Not every strong move is forcing. Quiet moves can improve, defend or create unavoidable threats."}]},{"id":"L50","stage":6,"title":"Visualize the board after every move","theme":"calculation","minutes":8,"idea":"Visualization is accurate bookkeeping. After a capture, remove the captured piece in your mental picture. After a pawn move, update the squares it attacks. After a clearance move, notice the line that opens behind it. Many calculation errors are failures to update the board.","method":"Practice short lines with a frozen board. After three half-moves, name the location of each moved piece and whether either king is in check. Increase length only when the shorter line is consistently accurate.","trap":"Do not force long lines while pieces keep reappearing on old squares in your imagination. Slower, accurate short calculation is a better foundation.","transfer":"Use Blind calculation mode on a puzzle; enter your predicted line before moving on the board.","questions":[{"q":"What must change in your mental board after a capture?","options":["The capturing piece moves and the captured piece disappears.","Only the material count.","Nothing until the full line finishes."],"correct":0,"explain":"Accurate line calculation requires a new board state after each half-move."},{"q":"How should you increase visualization difficulty?","options":["Extend the line after shorter lines are accurate.","Start with the longest line possible, even if inaccurate.","Avoid checking your predicted position."],"correct":0,"explain":"Accuracy provides the foundation for depth. Repeatedly rehearsing mistaken positions is not useful practice."}]},{"id":"L51","stage":6,"title":"Give the defender their best move","theme":"calculation","minutes":8,"idea":"A convincing line survives the strongest defense, not the most natural-looking one. Defensive resources include counterchecks, returning material, changing move order, escaping to an unexpected square and declining a sacrifice.","method":"At the key point in your line, switch sides deliberately. Search for the response you least want to face. If it refutes the idea,
